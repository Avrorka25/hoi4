 VEN_cult_of_creole_desc:0 ""
 VEN_arm_the_companies:0 "Вооружить компании"
 VEN_arm_the_companies_desc:0 ""
 VEN_export_oil_aggressively:0 "Агрессивно экспортировать нефть"
 VEN_export_oil_aggressively_desc:0 ""
 VEN_seize_public_services:0 "Захватить общественные службы"
 VEN_seize_public_services_desc:0 ""
 VEN_seize_government_assets:0 "Захватить государственные активы"
 VEN_seize_government_assets_desc:0 ""
 VEN_by_any_means:0 "§RЛюбыми средствами§!"
 VEN_by_any_means_desc:0 "Поражения не существует. Полная победа достижима при абсолютной решимости, какой бы ни была цена."
 VEN_creole_indivisible:0 "Креольское единство"
 VEN_creole_indivisible_desc:0 ""
 VEN_venezuelan_fortress:0 "[VEN.GetAdjective] крепость"
 VEN_venezuelan_fortress_desc:0 ""
 VEN_eliminating_the_competition:0 "Устранить конкурентов"
 VEN_eliminating_the_competition_desc:0 ""
 VEN_militarize_the_people:0 "Милитаризировать народ"
 VEN_militarize_the_people_desc:0 ""
 VEN_viva_venezuela:0 "Да здравствует Венесуэла"
 VEN_viva_venezuela_desc:0 "Нам никто не нужен, чтобы достичь величия! [VEN.getNameDefCap] сама проложит путь к славе и процветанию!"
 VEN_gran_colombia:0 "Возродить Великую Колумбию"
 VEN_gran_colombia_desc:0 "Симон Боливар был единственным [VEN.getAdjective] У него была блестящая концепция большего союза между всеми латиноамериканскими странами Центральной и Южной Америки. Мы будем чтить его наследие, возрождая дух Великой Колумбии и узаконивая его в наше время!"
 VEN_seize_curacao:0 "Решить вопрос Кюрасао"
 VEN_seize_curacao_desc:0 "Архипелаг Кюрасао является колониальным владением [695.Owner.getNameDef], хотя всегда считался неотъемлемой частью боливарианской, а затем и [VEN.GetAdjective] сферы влияния. Расположенный у нашего побережья, Кюрасао служит базой [695.Owner.getAdjective] флота и надёжным экспортёром сырья. Пренебрежение [695.Owner.getAdjective] властей этими землями даёт прекрасную возможность заявить на них свои права."
 VEN_annex_colombia:0 "Объединить боливарианских братьев"
 VEN_annex_colombia_desc:0 "В 1831 году идея Великой Колумбии получила первый тяжёлый удар, и стало ясно, что тогда воплотить её было невозможно. Теперь, заняв прочное место в мире, мы можем вновь обратиться к [COL.getAdjective] братьям и сёстрам с предложением желанного объединения. Разумеется, под нашим знаменем."
 VEN_demand_guyana:0 "Потребовать Гайану"
 VEN_demand_guyana_desc:0 "С момента создания нашего государства в 1824 году многие считали Демерару-Эссекибо неотъемлемой частью нашей страны. Пока мы были слабы и нестабильны, [ENG.getNameDef] объединила мятежное население в [ENG.getAdjective] Гайану и превратила её в свой форпост. По праву первенства эти земли принадлежат нам!"
 VEN_attack_peru:0 "Осуществить этнокасеризм"
 VEN_attack_peru_desc:0 "Этнокасеризм основан на идее [PRU.getAdjective] самоопределения и стремится установить пролетарскую диктатуру в Андах. Мы можем объединить многие коренные племена, ищущие свободы, и дать им новую надежду. И новое руководство."
 VEN_attack_ecuador:0 "Вернуть Эквадор"
 VEN_attack_ecuador_desc:0 "Третий участник Великой Колумбии, ныне известный как [ECU.getNameDef], находится за горными хребтами и ждёт объединения с остальной частью нашей страны. Настало время раз и навсегда даровать ему желанную свободу!"
 VEN_strike_panama:0 "Ударить по Панаме"
 VEN_strike_panama_desc:0 "Жалкое [COL.getAdjective] руководство подчинилось условиям неравноправных Нерландского и Висконсинского договоров 1903 года, уступив департамент Панама [USA.getNameDef]. Мы — новая законная Великая Колумбия, и только мы можем отомстить за эту несправедливость!"
 VEN_bolivarian_development:0 "Боливарианское развитие"
 VEN_bolivarian_development_desc:0 "Территории Великой Колумбии слишком долго оставались в запустении. Им необходимы надлежащее переустройство управления, индустриализация и общая программа добычи ресурсов."
 VEN_unify_bolivariana_army:0 "Объединить боливарианскую армию"
 VEN_unify_bolivariana_army_desc:0 "В единстве наша сила! Для успеха проекта Великой Колумбии разрозненные армии и командиры должны объединиться под знаменем великоколумбийского единства. Только так мы выдержим давление любой внешней угрозы!"
 VEN_unify_political_command:0 "Объединить национальную политику"
 VEN_unify_political_command_desc:0 "Раздутые и коррумпированные бюрократии привели к падению одной из величайших держав Южной Америки. Извлекая уроки из прошлого, мы создадим единое централизованное правительство, основанное на справедливом представительстве населения."
 VEN_exploit_colombian_rubber:0 "Разрабатывать колумбийский каучук Амазонии"
 VEN_exploit_colombian_rubber_desc:0 "Амазония богата каучуком, и он должен стать доступен нашей промышленности."
 VEN_expand_ecuadorian_cocoa_fields:0 "Расширить эквадорские плантации какао"
 VEN_expand_ecuadorian_cocoa_fields_desc:0 "Регион Пьюра в Эквадоре в последние годы процветал благодаря огромному экспорту какао. Взяв эти хозяйства под контроль и расширив их, мы получим колоссальную прибыль."
 VEN_expand_gran_colombia:0 "Подготовить расширение Великой Колумбии"
 VEN_expand_gran_colombia_desc:0 "Великая Колумбия сильна как никогда! Настало время распространить влияние на остальную Латинскую Америку — силой оружия или искусной дипломатией."
 VEN_alliance_with_honduras:0 "Союз с фруктовыми компаниями"
 VEN_alliance_with_honduras_desc:0 ""
 VEN_attack_central_america:0 "План «Северо-Запад»"
 VEN_attack_central_america_desc:0 ""
 VEN_alliance_with_mexico:0 "Подружиться с мексиканскими синдикалистами"
 VEN_alliance_with_mexico_desc:0 ""
 VEN_attack_mexico:0 "План «Верде»"
 VEN_attack_mexico_desc:0 ""
 VEN_invade_mexico_tooltip:0 "Получает претензии на все национальные территории §H[MEX.GetAdjective]§! стороны"
 VEN_attack_bolivia:0 "План «Юго-Восток»"
 VEN_attack_bolivia_desc:0 ""
 VEN_alliance_with_bolivia:0 "Союз с Боливией"
 VEN_alliance_with_bolivia_desc:0 ""
 VEN_alliance_with_south_south_america:0 "Союз с Югом"
 VEN_alliance_with_south_south_america_desc:0 ""
 VEN_attack_south_south_america:0 "План «Дальний Юг»"
 VEN_attack_south_south_america_desc:0 ""
 VEN_intervention_in_brazil:0 "Интервенция в Бразилию"
 VEN_intervention_in_brazil_desc:0 "Наша кампания воссоединения не осталась незамеченной соседями. [BRA.getAdjective] администрация усилила контроль над коренными народами Амазонского плато. Некоторые беженцы сообщают о неописуемых зверствах. Мы должны вмешаться и спасти этих людей!"
 VEN_attack_america:0 "Ударить по гиганту"
 VEN_attack_america_desc:0 "За Карибским морем лежит пробудившийся гигант, активно ищущий добычу. На пути к господству в полушарии он уже поглотил многих. Отныне мы навяжем ему собственную доктрину Монро!"
 VEN_push_north:0 "Взгляд на север"
 VEN_push_north_desc:0 "Страны Карибского региона слабы и вызывают интерес континентальных держав. Очевидно, что нам необходимо усилить флот и вновь заявить права на эти земли."
 VEN_prepare_amphibious_landings:0 "Подготовить морские десанты"
 VEN_prepare_amphibious_landings_desc:0 "Архипелажная природа Карибского моря издавна благоприятствовала пиратству. Большой флот здесь будет неэффективен. Нужны лишь один человек в нужном месте и в нужное время да несколько увлечённых авантюристов."
 VEN_attack_cuba:0 "Устранить кубинскую угрозу"
 VEN_attack_cuba_desc:0 "[CUB.getAdjective] остров имеет стратегическое значение и является главным региональным экспортёром редких материалов для тяжёлых кораблей. Некоторые его активы будут ценны для нашего дальнейшего развития."
 VEN_seize_trinidad:0 "Предъявить права на Тринидад"
 VEN_seize_trinidad_desc:0 "«Порт-оф-Спейн» назван так неслучайно. В 1797 году остров был неожиданно и стремительно захвачен [ENG.getAdjective] силами. С тех пор мы многому у них научились и способны провести подобную операцию в куда большем масштабе. Бойся нас, [ENG.getName]: Порт-оф-Спейн вновь станет испаноязычным!"
 VEN_attack_hispaniola:0 "Обезопасить Эспаньолу"
 VEN_attack_hispaniola_desc:0 "Небольшие государства на карибском острове Эспаньола также должны войти в нашу сферу влияния. Проследим, чтобы они «свободно» последовали нашим путём."
 VEN_intergrate_caribbean:0 "Карибский союз"
 VEN_intergrate_caribbean_desc:0 "Карибские народы — наши естественные друзья, и при их местной поддержке мы сможем создать великий союз и по праву утвердить господство над Карибами!"
 VEN_caribbean_naval_hub:0 "Создать Карибский военно-морской центр"
 VEN_caribbean_naval_hub_desc:0 "Недавно созданным форпостам не хватает причальных баз, судостроительных мощностей и надлежащей инфраструктуры. Контроль над регионом открывает уникальную возможность значительно усилить наш флот."
 VEN_connect_the_cities:0 "Соединить города"
 VEN_connect_the_cities_desc:0 "Для укрепления власти над Карибами необходимо связать между собой все крупные города. Этого можно добиться строительством новых дорог, железных дорог и портов."
 VEN_recruit_haitian_pilots:0 "Набрать гаитянских лётчиков"
 VEN_recruit_haitian_pilots_desc:0 "Гаити, несомненно, добилась больших успехов в производстве самолётов и подготовке пилотов. Возможно, набор этих бывших лётчиков поможет развитию нашей авиационной промышленности."
 VEN_form_cuban_divisons:0 "Сформировать кубинские оборонительные дивизии"
 VEN_form_cuban_divisons_desc:0 "Значительная часть бывшей кубинской армии быстро записывается в наши новые вооружённые силы на острове. Это хорошая возможность сформировать дивизии из этнических кубинцев и одновременно укрепить контроль над регионом."
 VEN_legacy_of_piracy:0 "Наследие пиратства"
 VEN_legacy_of_piracy_desc:0 "Если Чёрная Борода сумел нарушить торговлю во всём регионе, сможем и мы. Поднимем «Весёлого Роджера»!"
 VEN_modern_pirate_navy:0 "Современный пиратский флот"
 VEN_modern_pirate_navy_desc:0 "Чтобы достичь прежней цели и нарушить торговлю по всему Карибскому морю, нам нужны современные боевые корабли, способные противостоять любому, кто осмелится бросить нам вызов."
 VEN_unite_the_caribbean_under_venezuela:0 "Присоединить оставшиеся Карибы"
 VEN_unite_the_caribbean_under_venezuela_desc:0 "Теперь, когда нынешний Карибский союз укреплён, настало время полностью оправдать его название и объединить весь регион под [VEN.GetAdjective] флагом!"
 VEN_neutrality_focus:0 "Сохранять международный нейтралитет"
 VEN_neutrality_focus_desc:0 "Руководство страны прекрасно понимает, что любой экономический или военный союз лишь втянет наше хрупкое государство в очередную тотальную войну. Народ выступает за мир, и по всей стране слышны риторические возгласы: «Война! Для чего она нужна?»"
 VEN_oil_protection:0 "Использовать главное преимущество страны"
 VEN_oil_protection_desc:0 "Страна должна быть готова ко всему. Амазонские джунгли с их труднопроходимой местностью образуют почти непреодолимую линию обороны против крупных армейских соединений. Наш сосед [COL.getNameDef] также отстранился от напряжённой международной обстановки, поэтому единственным доступным путём вторжения остаётся море. Укрепление городов и расширение береговой охраны в будущем помогут защитить нефтяные месторождения."
 VEN_zulia_line:0 "Линия Сулии"
 VEN_zulia_line_desc:0 "Агенты сообщают о масштабных [COL.getAdjective] военных учениях у нашей границы. Труднопроходимая местность на юге и нехватка инфраструктуры в районе Боливара указывают, что наступление, вероятнее всего, начнётся через северные прибрежные районы. Границу необходимо немедленно укрепить!"
 VEN_non_agression_colombia:0 "Пакт о ненападении с Колумбией"
 VEN_non_agression_colombia_desc:0 "Хотя у нас много общего, некоторые мятежные каудильо или провокаторы могут попытаться испортить хорошие отношения с [COL.getNameDef]. Пакт о ненападении позволит сохранить дружественную позицию обеих сторон."
 VEN_arms_protect_the_nation:0 "Оружие защищает страну"
 VEN_arms_protect_the_nation_desc:0 "Выражение «лучшая защита — нападение» придумано не [VEN.getAdjective] народом. Тем не менее, если потенциальный враг пересечёт границу, регулярная армия должна быть готова отразить агрессора любыми средствами."
 VEN_join_allies:0 "Отвергнуть фашизм"
 VEN_join_allies_desc:0 "Несмотря на прежние симпатии к фашистам, очевидно, что мировые демократии сражаются за свободу. Поэтому мы и наши нефтяные месторождения встанем под знамёна Союзников!"
 VEN_food_importation:0 "Импорт продовольствия"
 VEN_food_importation_desc:0 "Самообеспечение и автаркия могут казаться перспективными в краткосрочной перспективе, но открытая торговля с союзниками принесёт экономике куда больше пользы. Уже заключено несколько соглашений об импорте товаров и продовольствия с Запада."
 VEN_assisted_oil_development:0 "Развитие нефтяной отрасли при поддержке союзников"
 VEN_assisted_oil_development_desc:0 "Наша приверженность борьбе с фашизмом способствовала более тесному сотрудничеству исследовательских коллективов и промышленных предприятий. Первой выгоду получит нефтяная отрасль."
 VEN_british_air_bases:0 "Британские авиабазы"
 VEN_british_air_bases_desc:0 "Несколько европейских агентов перешли на нашу сторону и раскрыли тревожную правду о группах подводных лодок, скрывающихся в Карибском бассейне, чтобы атаковать ничего не подозревающие конвои в открытом море. Из-за отсутствия морского патрулирования и морских бомбардировщиков обнаружить угрозу крайне сложно. Однако союзники располагают такими возможностями и готовы помочь, если будут построены необходимые объекты."
 VEN_foreign_expeditions:0 "[VEN.GetAdjective] экспедиционный корпус"
 VEN_foreign_expeditions_desc:0 "Мы можем стремиться к миру, но враги не обязаны делать то же самое. Подготовленный корпус для участия в международной борьбе за рубежом позволит расширить наше присутствие и защищать демократические принципы по всему миру."
 VEN_embargo_japan:0 "Ввести нефтяное эмбарго против Японии"
 VEN_embargo_japan_desc:0 "[JAP.getNameDefCap] стремится получать всё больше ресурсов из Юго-Восточной Азии, особенно каучука для самолётов и нефти для огромного флота. Если экспансия продолжится, однажды её корабли могут появиться у наших берегов. Пора продемонстрировать приверженность борьбе с этим режимом и ввести торговое эмбарго."
 VEN_anti_submarine:0 "Помочь на Атлантическом театре"
 VEN_anti_submarine_desc:0 "Неограниченная подводная война мешает торговле прямо у наших берегов. Надлежащим ответом станет защита морских путей несколькими недавно разработанными эсминцами и крейсерами."
 VEN_latin_america_guardian:0 "Защитник Латинской Америки"
 VEN_latin_america_guardian_desc:0 "[VEN.GetName] — яркий маяк свободы и сильной демократии Латинской Америки. Наш долг — защищать соседние страны от радикальных и деспотичных режимов не только во имя свободы, но и ради вечного мира для всех!"
 VEN_attack_japan:0 "Перенести войну на восток"
 VEN_attack_japan_desc:0 "[JAP.getAdjective] угроза продолжает расти. Они наверняка не ожидают удара с нашей стороны — над Тихим океаном взойдёт новое солнце!"
 VEN_attack_germany:0 "Устранить европейскую угрозу"
 VEN_attack_germany_desc:0 "Очевидно, угроза со стороны [GER.getNameDef] зашла слишком далеко. Чтобы защитить мировую демократию, Европу необходимо освободить раз и навсегда!"
 VEN_exile_government:0 "[VEN.GetAdjective] правительство в изгнании"
 VEN_exile_government_desc:0 "Мы пали, но не побеждены. Создание правительства в изгнании на территории союзников позволит продолжать борьбу с врагами до победного конца!"
 VEN_alliance_with_political_opponents:0 "Союз с политическими противниками"
 VEN_alliance_with_political_opponents_desc:0 "Несмотря на ненависть к политическим оппонентам, очевидно, что ради сохранения независимости страны мы должны забыть разногласия и выступить единым фронтом."
 VEN_evacuate_industry:0 "Эвакуировать промышленные резервы"
 VEN_evacuate_industry_desc:0 "Необходимо эвакуировать промышленные резервы, прежде чем враг использует их против нас. Вместо этого они значительно помогут продолжать борьбу."
 VEN_target_collaborators:0 "Наказать коллаборационистов"
 VEN_target_collaborators_desc:0 "Каждый, кто оказался достаточно труслив, чтобы предать великую страну, заслуживает всей суровости нашего правосудия. Или пули."
 VEN_liberation:0 "Освобождение"
 VEN_liberation_desc:0 "Мы успешно вернулись на родную землю и освободили страну. Теперь можно восстановить правительство и завершить изгнание!"
 VEN_FVI:0 "Организовать ВВС"
 VEN_FVI_desc:0 "Внутренние силы Венесуэлы — недавно созданное подпольное движение сопротивления, призванное показать иностранным оккупантам, что наша страна не сдаётся без борьбы."
 VEN_venezuelan_military_academy:0 "Расширить Военную академию"
 VEN_venezuelan_military_academy_desc:0 "Хуан Висенте Гомес был мудрым человеком и стремился создать современную армию по прусскому образцу. Рост напряжённости в мире требует новых инвестиций для повышения боеспособности войск."
 VEN_form_the_GNB:0 "Основать НБГ"
 VEN_form_the_GNB_desc:0 "Вооружённым силам нужны специализированные подразделения для выполнения жандармских задач и защиты гражданского населения. Собранные средства позволят создать новую национальную гвардию, которая при необходимости сможет служить резервной лёгкой пехотой."
 VEN_modernize_our_weaponry:0 "Модернизировать вооружение"
 VEN_modernize_our_weaponry_desc:0 "Среди множества образцов оружия, используемых войсками, некоторые безнадёжно устарели и значительно уступают другим. Стандартизация и модернизация не так сложны, если знать, к кому обратиться и какие изменения необходимы."
 VEN_radio_technologies:0 "Радиотехнологии"
 VEN_radio_technologies_desc:0 "Радиосвязь между быстро наступающими моторизованными колоннами значительно повысит их боевые возможности, скорость планирования и время реакции на угрозы."
 VEN_central_intelligence:0 "Центральная разведка"
 VEN_decryption_department:0 "Отдел дешифровки"
 VEN_decryption_department_desc:0 "Если возникнет необходимость, отдел по расшифровке вражеских сообщений даст нам решающее преимущество."
 VEN_central_intelligence_desc:0 "Разведывательное бюро необходимо для защиты наших интересов внутри страны и за рубежом. Оно также не позволит важным сведениям попасть в недружественные руки."
 VEN_new_military_institute:0 "Военная академия НБГ"
 VEN_new_military_institute_desc:0 "Появление новой волны офицеров создаёт подходящий момент для открытия военного института, где они смогут представить свои идеи."
 VEN_army_motorization:0 "Моторизация армии"
 VEN_army_motorization_desc:0 "Наблюдения за Великой войной показывают, что пехота исчерпала себя как наступательная сила. Новый тип войны для [VEN.getNameDef] должен основываться на скорости, обходных манёврах, внезапных атаках и широком применении моторизации, как предлагает Антонио Чальбо Кардона."
 VEN_field_piece_research:0 "Исследование полевой артиллерии"
 VEN_field_piece_research_desc:0 "Артиллерия должна стать основой армии, поэтому следует направить значительные ресурсы на увеличение огневой мощи."
 VEN_develop_venezuelan_armour:0 "Разработать [VEN.GetAdjective] бронетехнику"
 VEN_develop_venezuelan_armour_desc:0 "Изобилие топлива позволяет развёртывать крупные бронетанковые соединения, которые будут особенно эффективны на равнинах у побережья. Некоторые специалисты считают, что танковые дивизии сыграют решающую роль в разрешении международных конфликтов как эффективная миротворческая сила. Любопытная мысль..."
 VEN_logistical_brigades:0 "Логистические бригады"
 VEN_logistical_brigades_desc:0 "В ближайшем будущем часть наших вооружённых сил может столкнуться с опасной зависимостью от местных запасов. Надёжное снабжение материалами, снаряжением и продовольствием улучшит боевой дух, организацию и общую боеспособность."
 VEN_bicycle_battalions:0 "Велосипедные батальоны"
 VEN_bicycle_battalions_desc:0 "Моторизация — будущее, но существуют районы, недоступные грузовикам, где скорость всё равно крайне важна. Использование велосипедов позволит проводить разведку и патрулирование там, где техника не сможет действовать."
 VEN_adapt_to_the_amazons:0 "Приспособиться к Амазонии"
 VEN_adapt_to_the_amazons_desc:0 "Юг страны покрыт джунглями — одной из самых сложных местностей для ведения войны из-за отсутствия инфраструктуры, жары, влажности и множества смертоносных животных и растений. Всё это требует особого внимания к повышению боеспособности войск в подобных условиях."
 VEN_study_nuclear_power:0 "Исследовать ядерную энергию"
 VEN_study_nuclear_power_desc:0 "Недавние исследования показали, что ядерная энергия может стать будущим войны. Путь будет долгим и трудным, но следует направить ресурсы на овладение этой силой."
 VEN_jungle_vehicles:0 "Техника для джунглей"
 VEN_jungle_vehicles_desc:0 "Чтобы воевать в южных джунглях с полной эффективностью, необходимо адаптировать танки и моторизованную технику к суровым условиям."
 VEN_expand_the_navy:0 "Расширить флот"
 VEN_expand_the_navy_desc:0 "Военно-морская ветвь вооружённых сил куда менее коррумпирована и мятежна, чем сухопутная армия. Однако её нынешнее состояние жалко: имея лишь два эсминца, мы не способны даже должным образом усилить береговую охрану и остановить чрезмерную иммиграцию."
 VEN_destroyer_effort:0 "Современные эсминцы"
 VEN_destroyer_effort_desc:0 "Панамский канал значительно увеличил торговлю в Карибском регионе. Наши торговые суда и конвои должны получить надёжную защиту, иначе их уничтожат назойливые подводные лодки, скрывающиеся под синими водами."
 VEN_replace_miniscule_vessels:0 "Заменить крошечные суда"
 VEN_replace_miniscule_vessels_desc:0 "Новшества в морской войне постоянно разрабатываются и представляются на конференциях и совместных учениях. Мы можем многому научиться не только у союзников и врагов, но и на собственном опыте."
 VEN_the_big_guns:0 "Крупные орудия"
 VEN_the_big_guns_desc:0 "Великая война ясно показала, что сражения выигрывают крупные орудия. Возможности страны позволяют вкладываться в разработку новых тяжёлых кораблей."
 VEN_carrier_development:0 "Развитие авианосцев"
 VEN_carrier_development_desc:0 "Авианосцы, служащие огромными плавучими аэродромами, являются истинным лицом и главной боевой силой будущей морской войны. Отдельная программа их разработки обойдётся дорого, но это единственный путь к современному флоту."
 VEN_naval_attrition:0 "Истощение на море"
 VEN_naval_attrition_desc:0 "Карибское море известно архипелагами и скрытыми бухтами. Конвои вынуждены активно маневрировать, а крупные флоты часто занимают невыгодные позиции и плохо поворачивают. В случае войны это можно обратить в наше преимущество."
 VEN_expand_zulia_shipping:0 "Расширить судоходство Сулии"
 VEN_expand_zulia_shipping_desc:0 "Маракайбо — один из крупнейших портов и военно-морских баз страны, доступных иностранным торговцам и судам. Расширение его возможностей и диверсификация производства выведут судостроение на совершенно новый уровень."
 VEN_trade_fleets:0 "Торговые флоты"
 VEN_trade_fleets_desc:0 "Недавние новшества в производстве позволили строить конвои быстрее и дешевле, чем когда-либо. Для поддержки экспортной экономики жизненно необходим сильный торговый флот."
 VEN_protect_curacao:0 "Защитить [695.GetName]"
 VEN_protect_curacao_desc:0 "Острова АБК лежат у наших берегов и по всем признакам должны принадлежать нам. Географическая близость делает это естественным, а кроме того, почти вся наша нефть перерабатывается именно там. Учитывая слабость нидерландского правительства, оно наверняка не осмелится отклонить наше любезное предложение «помочь» в обороне островов..."
 VEN_marine_forces:0 "Морская пехота"
 VEN_marine_forces_desc:0 "Чтобы расширить возможности армии за морем, необходимо сформировать подразделение морской пехоты, способное проводить смелые десантные операции."
 VEN_amphibious_exercises:0 "Десантные учения"
 VEN_amphibious_exercises_desc:0 "Эффективный транспортный флот так же важен, как и боеспособная морская пехота. Одно без другого бесполезно."
 VEN_national_development:0 "Национальное развитие"
 VEN_national_development_desc:0 "[VEN.GetAdjective] экономика уже долго находится в плохом состоянии. Финансируемая правительством комиссия определит наиболее нуждающиеся отрасли и распределит средства, заложив основу роста промышленного потенциала."
 VEN_national_recovery_act:0 "Национальный закон о восстановлении"
 VEN_national_recovery_act_desc:0 "Экономика страны чрезмерно зависит от экспорта сырой нефти, который составляет до 80% общей стоимости экспорта. Дальнейшая опора исключительно на невозобновляемые ресурсы может дорого обойтись народу. Избавиться от зависимости трудно, но рано или поздно это необходимо сделать."
 VEN_alternatives_to_oil:0 "Альтернативы нефти"
 VEN_alternatives_to_oil_desc:0 "Недавняя геологическая разведка обнаружила залежи железной руды в Серро-Сан-Исидро, предоставив нам альтернативу нефтяному экспорту."
 VEN_invest_mining_industry:0 "Инвестировать в горнодобывающую промышленность"
 VEN_invest_mining_industry_desc:0 "Очевидно, что множество ресурсов лежит прямо у нас под ногами. Геологам требуется лишь дополнительное финансирование для проведения новых исследований [ROOT.getAdjective] земли."
 VEN_improve_living_standards:0 "Повысить уровень жизни"
 VEN_improve_living_standards_desc:0 "Многие граждане лишены доступа к электричеству, телеграфу или радио и не могут своевременно получать новости от правительства. Значительные вложения в эту сферу обойдутся дорого, но долгосрочные выгоды и благодарность народа того стоят!"
 VEN_industrial_development:0 "Промышленное развитие"
 VEN_industrial_development_desc:0 "Многочисленные рабочие демонстрации последних лет указывают на нехватку современных станков и базового строительного оборудования на заводах и стройках. Государственные программы по решению этой проблемы уже рассматриваются Конгрессом."
 VEN_lift_oil_curse:0 "Избавиться от нефтяного проклятия"
 VEN_lift_oil_curse_desc:0 "Зависимость от нефти нанесла экономике огромный ущерб. К счастью, недавний поворот к добыче других видов ресурсов показывает, что иностранные инвесторы заинтересованы и в них. Теперь, когда реформы завершены, нефтяное проклятие можно считать окончательно побеждённым."
 VEN_expand_oil_industry:0 "Расширить нефтяную промышленность"
 VEN_expand_oil_industry_desc:0 "Зависимость от нефти — единственный способ сохранить позиции экономики на мировом рынке. Поэтому логично увеличить инвестиции и открыть рынки для новых нефтяных экспортёров со всего мира."
 VEN_engineering_schools:0 "Инженерные школы"
 VEN_engineering_schools_desc:0 "Недавние исследования [ROOT.getAdjective] геологической комиссии показывают, что государственные вложения в разведку ресурсов позволят добывать ещё больше полезных ископаемых. Некоторые политики уже продвигают соответствующий закон в Конгрессе."
 VEN_open_rubber_plantations:0 "Создать каучуковые плантации"
 VEN_open_rubber_plantations_desc:0 "Тёплый и влажный [ROOT.getAdjective] климат прекрасно подходит для каучуковых плантаций. Если [BRA.getAdjective] сторона способна собирать огромные объёмы каучука, почему мы не можем сделать то же самое?"
 VEN_expand_curacao_refinery:0 "Расширить нефтеперерабатывающий завод «Исла»"
 VEN_expand_curacao_refinery_desc:0 "Долгое время остававшийся без внимания остров Кюрасао наконец находится в наших руках. Мы расширим операционную базу и построим несколько нефтеперерабатывающих предприятий для увеличения производства топлива."
 VEN_establish_IFE:0 "Учредить ИФЕ"
 VEN_establish_IFE_desc:0 "Перевозка добытого сырья требует не только промышленной базы, но и надёжной инфраструктуры, связывающей порты с предприятиями. Для решения возникающих логистических проблем будет создана государственная железнодорожная компания — Институт государственных железных дорог."
 VEN_promote_foreign_investment:0 "Поощрять иностранные инвестиции"
 VEN_promote_foreign_investment_desc:0 "Многие иностранные корпорации, считающие перемены в [ROOT.getNameDef] прогрессивными, готовы вкладываться в местную промышленность и укреплять экономические связи. Кто мы такие, чтобы отказываться от их скромных инвестиций?"
 VEN_acheiving_autarky:0 "Добиться [ROOT.getAdjective] автаркии"
 VEN_acheiving_autarky_desc:0 "Наша нефть известна высоким качеством и октановым числом. Благодаря потоку инвестиций [ROOT.getNameDef] может провозгласить экспорт нефти и нефтепродуктов основой современного государства!"
 VEN_acquire_czech_weaponry:0 "Закупить [CZE.GetAdjective] вооружение"
 VEN_acquire_czech_weaponry_desc:0 "Для многих стран Латинской Америки закупки оружия у [CZE.GetNameDef] доказали свою эффективность в модернизации армии. Следует выделить средства и воспользоваться этим рынком ради собственных вооружённых сил."
 VEN_fund_independent_arms_industries:0 "Финансировать независимую оружейную промышленность"
 VEN_fund_independent_arms_industries_desc:0 "Создание нового промышленного концерна, способного массово производить пехотное снаряжение, значительно усилит нашу военную машину."
 VEN_adopt_rearmament_policies:0 "Принять политику перевооружения"
 VEN_adopt_rearmament_policies_desc:0 "Невиданный прежде военный конфликт изменит знакомый нам мир. Лучше подготовиться к любым испытаниям, которые принесут будущие войны."
 VEN_explosive_factories:0 "Заводы взрывчатых веществ"
 VEN_explosive_factories_desc:0 "Недостаток военных возможностей может сыграть на руку потенциальному врагу. Нельзя давать ему ни малейшего преимущества на поле боя! Всё для войск, какой бы ни была цена!"
 VEN_mighty_weaponry:0 "Могучее вооружение"
 VEN_mighty_weaponry_desc:0 "Чем крупнее и смертоноснее орудие, тем лучше. Враги задрожат от одного вида этих чудовищ!"
 VEN_production_quotas:0 "Производственные квоты"
 VEN_production_quotas_desc:0 "Чёткие квоты для оружейных заводов значительно повысят эффективность выпуска необходимого снаряжения."
 VEN_national_defense_funds:0 "Фонд национальной обороны"
 VEN_national_defense_funds_desc:0 "Безопасность [ROOT.GetNameDef] — наш главный приоритет. Для её обеспечения необходимо соответствующее финансирование."
 VEN_modern_machinery:0 "Современное оборудование"
 VEN_modern_machinery_desc:0 "Некоторые отрасли промышленности устарели и стали неэффективными. Закупка современного оборудования позволит привести их в надлежащее состояние."
 VEN_build_rural_schools:0 "Строить сельские школы"
 VEN_build_rural_schools_desc:0 "Значительная часть страны остаётся неразвитой, а во многих местах, особенно в сельской местности, отсутствует даже базовая система образования. Теперь, когда промышленность развивается, пора сосредоточиться на людях и дать им образование."
 VEN_develop_domestic_railways:0 "Развивать внутренние железные дороги"
 VEN_develop_domestic_railways_desc:0 "Внутренние железные дороги долго оставались неразвитыми. Для сильной [ROOT.GetAdjective] экономики они имеют важнейшее значение."
 VEN_a_seperate_branch:0 "Отдельный род войск"
 VEN_a_seperate_branch_desc:0 "Исторически [ROOT.GetNonIdeologyName] располагала крошечными военно-воздушными силами, подчинёнными армии и флоту. Настало время выделить авиацию в самостоятельный род войск, чтобы она смогла превратиться в эффективную и многочисленную боевую силу."
 VEN_fighter_development:0 "Развитие истребителей"
 VEN_fighters_development_desc:0 "Господство в воздухе достигается грамотным применением истребительных эскадрилий в воздушных боях и перехвате вражеских бомбардировщиков. Часть государственных средств можно направить на улучшение этих машин."
 VEN_purchase_british_aircraft:0 "Закупить [ENG.GetAdjective] самолёты"
 VEN_purchase_british_aircraft_desc:0 ""
 VEN_el_libertador_air_base:0 "Авиабаза «Эль-Либертадор»"
 VEN_el_libertador_air_base_desc:0 "Для расширения военно-воздушных сил мы выделим средства на строительство новых авиабаз, названных в честь самого Симона Боливара."
 VEN_naval_aircraft:0 "Морская авиация"
 VEN_naval_aircraft_desc:0 "Наши ВВС могут поддерживать флот, атаковать вражеские корабли и обеспечивать преимущество в морской войне."
 VEN_airforce_academy:0 "Военно-воздушная академия"
 VEN_airforce_academy_desc:0 "После недавнего создания наших военно-воздушных сил"
 VEN_bomber_production:0 "Производство бомбардировщиков"
 VEN_bomber_production_desc:0 "Изолированное положение страны означает, что она вряд ли станет целью вражеских бомбардировок, поэтому небольшой истребительной авиации достаточно для защиты неба [ROOT.getNameDef]. Основные вложения следует направить на разработку бомбардировщиков, способных наносить удары по промышленности противника издалека."
 VEN_rocketry_experiments:0 "Ракетные эксперименты"
 VEN_rocketry_experiments_desc:0 "В одном из исследовательских центров появилась интересная альтернатива бомбардировочным налётам: управляемая бомба, запускаемая с платформы и направляемая к цели без экипажа на борту. Это позволит сохранить здоровье и жизни пилотов и членов экипажей."
 VEN_radar_technologies:0 "Радиолокационные технологии"
 VEN_radar_technologies_desc:0 "Используя сложную систему радионавигации, мы нашли способ повысить точность обнаружения и поражения вражеских сил самолётами и кораблями даже ночью."
 VEN_military_disloyalty3:0 "Деполитизированная армия"
 VEN_corruption:0 "Повсеместная коррупция"
 VEN_tax_reform:0 "Проведённые налоговые реформы"
 VEN_corruption_desc:0 "Венесуэла имеет долгую историю коррупции. При Хуане Гомесе его власть поддерживалась назначением преданных людей на влиятельные должности. В результате многие отрасли управления заполнены некомпетентными и коррумпированными чиновниками, присваивающими государственные активы и пренебрегающими нуждами народа."
 VEN_corruption_2:0 "Реформы продолжаются"
 VEN_corruption_2_desc:0 "Проводятся реформы, призванные отменить политику Хуана Гомеса и устранить назначенных им коррумпированных чиновников, чтобы снизить уровень коррупции и стабилизировать страну."
 VEN_corruption_3:0 "Политическое сотрудничество"
 VEN_corruption_3_desc:0 "Чтобы искоренить коррупцию в Венесуэле, необходимо продемонстрировать прочное сотрудничество между различными партиями и навсегда устранить коррумпированных чиновников."
 VEN_corruption_4:0 "Наследие Гомеса"
 VEN_corruption_4_desc:0 "Многие считают Хуана Гомеса простым тираном, но они ошибаются. Гомес заложил основу великой [VEN.GetAdjective] системы, и мы должны продолжить начатое им."
 VEN_corruption_5:0 "Конституция 1936 года"
 VEN_corruption_6:0 "Закреплённые права женщин"
 VEN_corruption_7:0 "Радикализация плана Барранкильи"
