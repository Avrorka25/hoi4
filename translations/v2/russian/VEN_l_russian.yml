 VEN_push_to_end_captalism:0 "Великий натиск"
 VEN_push_to_end_captalism_desc:0 ""
 VEN_attack_britain:0 "Покончить со старой британской гегемонией"
 VEN_attack_britain_desc:0 ""
 VEN_attack_america_communist:0 "Сокрушить американскую мечту"
 VEN_attack_america_communist_desc:0 ""
 VEN_bolivarian_socialist_theory:0 "Боливарианская социалистическая теория"
 VEN_bolivarian_socialist_theory_desc:0 "После долгих лет чудовищной государственной коррупции и войн наш народ оказался сломлен и поставлен на колени. Демократический социализм Ромуло Бетанкура должен дать людям твёрдую опору, освободить страну от сил, тянувших её вниз, и вернуть ей былое величие."
 VEN_puntofijo_pact:0 "Пакт Пунто-Фихо"
 VEN_puntofijo_pact_desc:0 "КПВ хорошо послужила нам во Втором восстании Альварадо, но очевидно: если она станет слишком сильной, то предаст нас и установит очередную личную диктатуру. Пакт Пунто-Фихо между левоцентристскими партиями гарантирует, что Венесуэла больше никогда не окажется под диктатурой."
 VEN_amnesty_to_communists:0 "Смягчить план Барранкильи"
 VEN_amnesty_to_communists_desc:0 "План Барранкильи социал-демократичен по своей сути, но его также одобрили и подписали марксисты. Нет причин отказываться от этого сотрудничества: ради стабильности страны мы продолжим работать с КПВ, даже если не согласны со всеми её взглядами."
 VEN_50_50_oil_act:0 "Нефтяной закон «50 на 50»"
 VEN_50_50_oil_act_desc:0 "Наша страна — один из мировых лидеров по добыче нефти, но получает от этого крайне мало, поскольку большая часть доходов уходит местным и иностранным нефтяным компаниям. Закон «50 на 50» обеспечит равные доли государству и компаниям, чтобы выгоду получили все."
 VEN_national_literacy_programs:0 "Национальные программы ликвидации неграмотности"
 VEN_national_literacy_programs_desc:0 "Шестая и седьмая статьи плана Барранкильи предусматривают масштабные программы ликвидации неграмотности среди крестьян и рабочих, а также расширение автономии университетов. Мы воплотим это в жизнь."
 VEN_tax_reforms_socialist:0 "Снизить налоги на нефть"
 VEN_tax_reforms_socialist_desc:0 "Нет особого смысла облагать наш народ налогами за добычу нефти, если он почти ничего не получает взамен."
 VEN_rebellion_recoverment_effots:0 "Восстановление после восстания"
 VEN_rebellion_recoverment_effots_desc:0 "Второе восстание Альварадо и последовавшая гражданская война разрушили значительную часть страны и промышленности. Мы обязаны восстановить заводы и города — ради себя и народа."
 VEN_president_betancourts_legacy:0 "Наследие президента Бетанкура"
 VEN_president_betancourts_legacy_desc:0 ""
