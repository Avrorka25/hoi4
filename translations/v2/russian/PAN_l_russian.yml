 panama.1.t:0 "Аросемена «избран»"
 panama.1.d:0 "Демократию не стоит сохранять. \n\n Покинув партию, благодаря которой он был избран, Армодио Ариас Мадрид решил удержать власть в узком кругу преданных сторонников и полностью поддержал своего министра иностранных дел Хуана Демостенеса Аросемену Барреати. Конечно, победить на выборах одновременно и бывшую собственную партию, и обычную оппозицию было бы непросто, но Мадрид и Барреати хорошо подготовились: вместо того чтобы полагаться на ленивых и ненадёжных избирателей, Мадрид просто сам изготовил нужные голоса. Несколько слишком дерзких граждан выразили недовольство, но арест наиболее влиятельных быстро заставил остальных замолчать. \n\nМеждународное сообщество пока хранит молчание. Заявлять о поддержке высоких понятий вроде «демократии» или «свободы слова» легко, а организовывать эмбарго или военную интервенцию трудно. Кроме того, большинство иностранных лидеров вполне устраивает Барреати: стабильный авторитарный режим куда предсказуемее демократии с постоянно меняющимися лидерами и ценностями."
 panama.1.a:0 "¡Вива Барреати!"
