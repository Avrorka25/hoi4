 EGY_farouk_i_idea:0 "Фарук I"
 EGY_farouk_i_idea_desc:0 "Фарук I является нынешним королём [ROOT.GetNonIdeologyName] и [SUD.GetNonIdeologyName]. Хотя страна стала конституционной монархией, он по-прежнему обладает значительным влиянием в политике и служит важным объединяющим символом."
