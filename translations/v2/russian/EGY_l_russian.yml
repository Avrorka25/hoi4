 EGY_the_non_alligned_movement_desc:0 ""
 EGY_development_in_sudan:0 "Развитие Судана"
 EGY_development_in_sudan_desc:0 "[SUD.GetNonIdeologyName] способен стать ценным экономическим партнёром. Мы увеличим вложения в его промышленность, окажем помощь в модернизации фабрик и предприятий, а также будем поощрять сотрудничество и совместные проекты между [SUD.GetAdjective] и [EGY.GetAdjective] компаниями. Это укрепит экономические связи между двумя странами."
 EGY_construct_khartoum_juba_link:0 "Железная дорога [551.GetName] — [884.GetName]"
 EGY_construct_khartoum_juba_link_desc:0 "Строительство железной дороги между Хартумом и Джубой откроет новые экономические возможности внутри [SUD.GetNonIdeologyName]. Она ускорит и упростит перевозку товаров и людей, а также будет способствовать торговле и сотрудничеству."
 EGY_expand_jonglei_aluminum:0 "Развивать алюминиевую промышленность в [884.GetName]"
 EGY_expand_jonglei_aluminum_desc:0 "Регион Верхнего Нила обладает огромными запасами алюминия. Мы увеличим инвестиции в добычу, переработку и производство алюминия, а также окажем помощь в модернизации отрасли. Развитие алюминиевой промышленности Верхнего Нила обеспечит доступ к важнейшему ресурсу для собственных промышленных нужд и экспорта."
 EGY_ministry_of_resources:0 "Министерство ресурсов"
 EGY_ministry_of_resources_desc:0 "Чтобы обеспечить потребности страны в ресурсах и максимально использовать их потенциал, необходимо расширить возможности Министерства ресурсов. Для этого увеличим финансирование и штат, а также предоставим обучение и современное оборудование."
 EGY_misr_for_trade_and_oil:0 "«Миср» по торговле и нефти"
 EGY_misr_for_trade_and_oil_desc:0 "Создание государственной компании «Миср» по торговле и нефти поможет обеспечить и расширить доступ страны к жизненно важным ресурсам, включая нефть и другие стратегические материалы."
 EGY_banha_industrial_sectors:0 "Промышленные районы Банхи"
 EGY_banha_industrial_sectors_desc:0 "Город Банха способен стать крупным промышленным центром страны. Мы вложимся в инфраструктуру, обеспечим обучение и поддержку местной промышленности, а также поощрим компании открывать предприятия в этом районе. Развитие промышленности Банхи создаст рабочие места, ускорит экономический рост региона и разнообразит нашу промышленную базу."
 EGY_promote_agricultural_development:0 "Содействовать развитию сельского хозяйства"
 EGY_promote_agricultural_development_desc:0 ""
 EGY_banque_misr:0 "Финансировать Банк Миср"
 EGY_banque_misr_desc:0 "Банк Миср является важнейшим институтом экономической стабильности и роста страны. Мы предоставим необходимое финансирование для расширения его деятельности и улучшения услуг."
 EGY_expand_the_aswan_hydroelectric_facility:0 "Расширить Асуанскую гидроэлектростанцию"
 EGY_expand_the_aswan_hydroelectric_facility_desc:0 "Строительство Асуанской плотины принесло стране многочисленные преимущества: рост производства гидроэлектроэнергии, улучшение орошения сельскохозяйственных земель и более надёжный контроль над Нилом. Новые возможности в регионе позволят добиться стремительного промышленного роста."
 EGY_develop_the_east:0 "Развивать восток"
 EGY_develop_the_east_desc:0 "[457.GetName] долгое время оставался наименее развитой частью страны. Настало время развить промышленность региона и поднять её до уровня остальных областей."
 EGY_national_defence_funds:0 "Фонды национальной обороны"
 EGY_national_defence_funds_desc:0 "Безопасность [ROOT.GetNameDef] является нашим главным приоритетом, поэтому необходимо обеспечить достаточное финансирование."
 EGY_rural_education_plan:0 "План сельского образования"
 EGY_rural_education_plan_desc:0 "Значительная часть страны остаётся неразвитой, а многие жители, особенно в сельской местности, лишены базового образования. На фоне новых промышленных достижений пора уделить внимание народу и обеспечить ему доступ к обучению."
 EGY_expand_the_defence_department:0 "Расширить Министерство обороны"
 EGY_expand_the_defence_department_desc:0 "Сильная оборона является основой безопасности любой страны. Чтобы защитить народ, необходимо расширить и модернизировать Министерство обороны, лучше подготовив его к вызовам постоянно меняющегося мира и любым потенциальным угрозам."
 EGY_reinforce_the_north:0 "Укрепить север"
 EGY_reinforce_the_north_desc:0 "Из-за протяжённого побережья мы уязвимы для нападения с моря. Необходимо укрепить северное побережье системой оборонительных сооружений, способных сдержать возможное морское вторжение."
 EGY_fortify_sudan:0 "Укрепить [SUD.GetNonIdeologyName]"
 EGY_fortify_sudan_desc:0 "Мы уязвимы для проникновения и нападения с юга. Необходимо укрепить южную границу в [SUD.GetNonIdeologyName] системой оборонительных сооружений, защищающих от внешних и внутренних угроз в этом регионе."
 EGY_the_eastern_frontier:0 "Восточная граница"
 EGY_the_eastern_frontier_desc:0 "Синайский полуостров имеет для нас огромное стратегическое значение. Необходимо укрепить его системой оборонительных сооружений."
 EGY_defence_of_cairo:0 "Оборона [907.GetCapitalVictoryPointName]"
 EGY_defence_of_cairo_desc:0 "Как столица, [907.GetCapitalVictoryPointName] имеет огромное значение для страны. Это не только центр правительства, но и важнейший узел культуры, промышленности и торговли. Для защиты города необходимо укрепить [907.GetCapitalVictoryPointName]: построить средства противовоздушной обороны, подземные бункеры и заграждения, способные замедлить наступление противника."
 EGY_organize_the_egyptian_resistance:0 "Организовать [EGY.GetAdjective] сопротивление"
 EGY_organize_the_egyptian_resistance_desc:0 "В случае вторжения нельзя терять надежду. Мы должны сплотить народ и создать движение сопротивления против оккупационных сил. Оно займётся подготовкой и вооружением мирных жителей, организацией диверсий и распространением пропаганды для ослабления власти противника, а также подготовит день восстановления суверенитета."
 EGY_evacuate_industrial_reserves:0 "Эвакуировать промышленные резервы"
 EGY_evacuate_industrial_reserves_desc:0 "Перед угрозой вторжения или оккупации крайне важно защитить промышленные резервы. Ключевые предприятия, оборудование и персонал будут перемещены в безопасные места как внутри страны, так и за её пределами. Это не позволит им попасть в руки врага и сохранит производство жизненно важных военных материалов."
 EGY_the_army_in_exile:0 "Армия в изгнании"
 EGY_the_army_in_exile_desc:0 "В случае оккупации мы не должны забывать конечную цель — возвращение суверенитета. Для этого необходимо создать армию в изгнании из верных и преданных солдат, готовых освобождать родину. Мы будем вербовать и обучать бойцов среди эмигрантов и беженцев, получать снаряжение от союзников и создавать структуру командования."
 EGY_exile_naval_forces:0 "Военно-морские силы в изгнании"
 EGY_exile_naval_forces_desc:0 "В случае оккупации нельзя оставлять военно-морские силы позади. Мы создадим флот в изгнании из верных моряков, готовых сражаться за освобождение родины. Для этого будем вербовать и обучать людей среди эмигрантов и беженцев, получать технику от союзников и создавать командную структуру."
 EGY_exiles_in_the_air:0 "Изгнанники в небе"
 EGY_exiles_in_the_air_desc:0 "В случае оккупации нельзя забывать и об авиации. Мы создадим военно-воздушные силы в изгнании из верных пилотов, готовых сражаться за освобождение родины. Для этого будем вербовать и обучать лётчиков среди эмигрантов и беженцев, получать технику от союзников и создавать командную структуру."
 EGY_egyptian_military_academy:0 "[EGY.GetAdjective] военная академия"
 EGY_egyptian_military_academy_desc:0 "Мы долго пренебрегали военным образованием и подготовкой, однако на фоне приближающейся войны необходимость современной и хорошо обученной армии стала очевидной."
 EGY_increase_british_arms_shipments:0 "Увеличить поставки [EGY.GetAdjective] вооружения"
 EGY_increase_british_arms_shipments_desc:0 ""
 EGY_continue_army_segregation:0 "Сохранить разделение в армии"
 EGY_continue_army_segregation_desc:0 "Важно сохранить целостность и чистоту [EGY.GetAdjective] вооружённых сил. Это обеспечит верность солдат стране и не позволит им проникнуться нежелательными идеями."
 EGY_sudanese_volunteers:0 "[SUD.getAdjective] добровольцы"
 EGY_sudanese_volunteers_desc:0 "Чтобы армия была сильной и эффективной, необходимо обеспечить разнообразие и равноправие среди солдат. Отменив разделение вооружённых сил и позволив [EGY.GetAdjective] и [SUD.GetAdjective] бойцам служить вместе, мы укрепим взаимопонимание, уважение и единство армии."
 EGY_modernize_our_weaponry:0 "Модернизировать вооружение"
 EGY_modernize_our_weaponry_desc:0 "Среди используемых войсками образцов оружия некоторые безнадёжно устарели и значительно уступают другим. Стандартизация и модернизация не столь сложны, если знать, к кому обратиться и какие изменения необходимы."
 EGY_field_piece_research:0 "Исследования полевой артиллерии"
 EGY_field_piece_research_desc:0 "Артиллерия должна стать основой нашей армии, поэтому следует выделить значительные ресурсы на повышение огневой мощи."
 EGY_logistical_brigades:0 "Логистические бригады"
 EGY_logistical_brigades_desc:0 "В ближайшем будущем части вооружённых сил могут столкнуться с опасной зависимостью от местных запасов. Надёжное снабжение материалами, оборудованием и товарами повысит их мораль, организацию и общую боеспособность."
 EGY_desert_camouflage:0 "Пустынный камуфляж"
 EGY_desert_camouflage_desc:0 "Поскольку большая часть территории покрыта пустыней, армии необходим соответствующий камуфляж. Он затруднит обнаружение наших солдат противником и даст дополнительное преимущество в пустынной войне."
 EGY_radio_technologies:0 "Радиотехнологии"
 EGY_radio_technologies_desc:0 "Радиосвязь между быстро наступающими моторизованными колоннами значительно повысит их боевые возможности, скорость планирования и быстроту реакции на угрозы."
 EGY_new_military_institute:0 "Новый военный институт"
 EGY_new_military_institute_desc:0 "Появление нового поколения офицеров делает момент подходящим для открытия военного института, где они смогут представить свои идеи."
 EGY_central_intelligence:0 "Центральная разведка"
 EGY_central_intelligence_desc:0 "В современном быстро меняющемся мире знание — сила. Центральная разведывательная сеть позволит собирать и анализировать сведения со всех уголков мира, обеспечивая преимущество над врагами: от шпионажа и тайных операций до радиотехнической разведки. Вложения в эту сеть помогут всегда оставаться на шаг впереди противников."
 EGY_decryption_department:0 "Дешифровальное управление"
 EGY_decryption_department_desc:0 "Чтобы защитить государственные тайны и противостоять иностранному шпионажу, необходимо создать первоклассное дешифровальное управление. Оно будет взламывать вражеские коды и расшифровывать сообщения, обеспечивая стратегическое преимущество в разведке."
 EGY_air_defenses:0 "Противовоздушная оборона"
 EGY_air_defenses_desc:0 "Мы укрепили сушу, но теперь необходимо сосредоточиться на защите неба."
 EGY_continue_motorization_of_the_army:0 "Продолжить моторизацию армии"
 EGY_continue_motorization_of_the_army_desc:0 "Эпоха пешего солдата подходит к концу, и мы должны приспособиться. Продолжение моторизации позволит армии быстро и эффективно перемещаться по полю боя, обходить противника и наносить удары там, где их меньше всего ждут. Это повысит мобильность, огневую мощь и скорость реакции."
 EGY_develop_egyptian_armour:0 "Разработка [EGY.GetAdjective] бронетехники"
 EGY_develop_egyptian_armour_desc:0 "Чтобы защитить солдат и дать им преимущество в бою, необходимо развивать современную бронетехнику. Программа включает исследование и производство новейшей танковой и индивидуальной брони, а также создание новых проектов. Это позволит выставить более грозные и стойкие вооружённые силы, способные выдерживать самые тяжёлые сражения."
 EGY_unit_777:0 "Подразделение 777"
 EGY_unit_777_desc:0 "Перед лицом растущих внешних угроз необходимо решительно защищать страну и народ. Для этого следует ускорить формирование подразделения 777 — элитной и высококвалифицированной части специального назначения."
 EGY_study_nuclear_power:0 "Проект ETRR-1"
 EGY_study_nuclear_power_desc:0 "Необходимо изучать ядерную энергию и её возможные применения. Освоив эту технологию, мы сможем разработать ядерное оружие, которое станет средством сдерживания потенциальных агрессоров."
 EGY_sameera_moussa:0 "Самира Муса"
 EGY_the_egyptian_army_idea:0 "[EGY.GetAdjective] армия"
 EGY_the_egyptian_army_idea_desc:0 "Годы пренебрежения со стороны правительства и слабость экономики привели армию в плачевное состояние. На случай нового конфликта необходимы модернизация и реформы."
 EGY_the_egyptian_army_modifier:0 "Египетская армия"
 EGY_modify_the_egyptian_army_intro:0 "Изменить §Y[EGY.GetAdjective] армию§!:"
 EGY_egyptian_military_academy_tt:0 "$EGY_modify_the_egyptian_army_intro$ \nСтоимость военачальников: §G-50%§!\nСтоимость сухопутной доктрины: §G-10%§!\nМножитель ежедневного прироста командного ресурса: §G+10%§!\n\n"
 EGY_new_military_institute_tt:0 "$EGY_modify_the_egyptian_army_intro$ \nСтоимость военачальников: §G-50%§!\nСтоимость сухопутной доктрины: §G-10%§!\n\n"
