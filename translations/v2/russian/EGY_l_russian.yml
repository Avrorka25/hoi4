 EGY_decision_cost_command_power_4:0 "£pol_power §Y50§! £command_power §Y10§!"
 EGY_decision_cost_command_power_4_blocked:0 "£pol_power §R50§! £command_power §R10§!"
 EGY_counterd_sudanese_separatists_recently:0 "противоборствующий [SUD.getAdjective] Совсем недавно сепаратисты"
 EGY_sudanese_uprising_timer:0 "Надвигающееся [SUD.GetAdjective] восстание"
 EGY_sudanese_uprising_timer_desc:0 "Из-за недавней нестабильности внутри страны наша и без того слабая власть над Суданом быстро рушится. Это лишь вопрос времени, когда сепаратисты смогут организовать открытое восстание."
 EGY_atbara_degree:0 "Атбарский декрет"
 EGY_atbara_degree_desc:0 "Сопротивление в Судане достигло критической точки. Чтобы сохранить преимущество в случае открытого восстания, необходимо ввести строгий военный режим в столичном регионе [551.GetName]. Это почти наверняка вызовет сильный гнев суданского населения."
 EGY_standard_suppression_description:0 "Недавняя сепаратистская активность усилила сопротивление в этом районе. Следует направить туда силы, пока оно не стало слишком мощным."
 EGY_suppress_sudanese_separatists_in_khartoum:0 "Подавить сепаратистов в Хартумском регионе"
