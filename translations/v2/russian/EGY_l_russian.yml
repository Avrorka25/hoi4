 EGY_1936_anglo_egyptian_conference_desc:0 "Англо-[EGY.GetAdjective] конференция в Лондоне знаменует первую торжественную встречу [ENG.getAdjective] и [EGY.getAdjective] правительств с 1922 года. Главной темой станет будущее [EGY.GetNonIdeologyName] и его отношения с Британией и Содружеством."
