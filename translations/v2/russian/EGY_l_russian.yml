 EGY_iron_guard_mobilization_desc:0 "Из-за нашей растущей активности против монархии королевская Железная гвардия мобилизуется, чтобы противостоять нам и подавить нашу деятельность."
 EGY_iron_guard_mobilization_tt:0 "Противная сторона получит дополнительное подразделение при начале гражданской войны."
 EGY_sway_a_commander_to_the_cause:0 "Склонить командира на нашу сторону"
 EGY_sway_a_commander_to_the_cause_desc:0 "Без поддержки части армии успешное восстание невозможно. При достаточном убеждении нам, возможно, удастся заручиться сочувствием и поддержкой одного из армейских командиров."
 EGY_political_assassinations:0 "Политические убийства"
 EGY_political_assassinations_desc:0 ""
 EGY_guns_for_the_cause:0 "Оружие для нашего дела"
 EGY_guns_for_the_cause_desc:0 "Для успешного восстания необходим большой запас боеприпасов для войск и партизан. К счастью, у нас есть сторонники в национальном арсенале и люди, готовые совершать налёты на военные склады ради дополнительного оружия."
