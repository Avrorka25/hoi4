 EGY_reestablish_control_over_sudan:0 "Восстановить контроль над Суданом"
 EGY_counter_rebels_in_sudan_category:0 "Борьба с сепаратистами в Судане"
 EGY_counter_rebels_in_sudan_category_desc:0 "С момента создания Англо-[EGY.GetAdjective] Судана в 1899 году там сохраняется сильное общественное недовольство, регулярно перерастающее в открытые восстания местного населения против [EGY.GetAdjective] и [ENG.GetAdjective] власти, несмотря на наше давнее стремление сохранить страну в едином союзе."
 EGY_these_states_have_sudanese_separatism:0 "В этих регионах действует [SUD.getAdjective] сепаратизм"
 EGY_khartoum_region:0 "Хартумский регион"
 EGY_darfur_region:0 "Дарфурский регион"
 EGY_upper_nile_region:0 "Регион Верхнего Нила"
 EGY_sudanese_agitation:0 "[SUD.getAdjective] волнения"
 EGY_sudanese_agitation_desc:0 "Растущее [SUD.GetAdjective] недовольство заставляет всё больше людей открыто выступать против оккупационных сил и прибегать к насилию ради достижения [SUD.GetAdjective] независимости.\n\n§YИспользуйте решения и фокусы для борьбы с [SUD.GetAdjective] сепаратизмом.§!"
 EGY_decision_cost_command_power:0 "£command_power  §Y15§!"
