 EGY_defender_of_the_arab_world_focus:0 "Защитник арабского мира"
 EGY_defender_of_the_arab_world_focus_desc:0 "Настало время арабскому миру самостоятельно вершить свою судьбу. Чтобы добиться этого, мы больше никогда не должны позволять империалистическим державам держать нас в подчинении."
