 EGY_backed_down_from_albania:0 "Отказались от притязаний на [ALB.GetNonIdeologyName]"
 EGY_establish_a_palestinian_potectorate:0 "Создать [PAL.GetAdjective] протекторат"
 EGY_establish_a_palestinian_potectorate_desc:0 "Теперь, когда мы предпринимаем действия по освобождению [PAL.GetAdjective] Идеально, если мы создадим каллиборационное правительство, чтобы помочь нам обеспечить их самоуправление и постоянную безопасность."
 EGY_establish_a_palestinian_potectorate_state_tt:0 "Получает во владение все контролируемые [PAL.GetAdjective] регионы."
 egypt.1.t:0 "Смерть Фуада I"
 egypt.1.d:0 "Фуад I, пять лет служивший султаном нашей страны, а затем ещё четырнадцать — королём, умер во сне в королевском дворце Куббех. Ему было 68 лет.\n\nФуад I провёл страну через заключительные этапы Великой войны, пережил [EGY.GetAdjective] революцию 1919 года и последующее провозглашение независимости от [ENG.GetNameDef] в 1922 году. Затем он укрепил международное положение [EGY.GetNameDef], реформировав и сформировав королевство в его нынешнем виде.\n\nПосле смерти Фуада его сын Фарук немедленно наследует престол как Фарук I. Однако из-за несовершеннолетия он будет находиться под регентством Азиза Иззата и нескольких других принцев до достижения совершеннолетия через год."
 egypt.1.a:0 "Мы потеряли национального героя."
 egypt.2.t:0 "Англо-[EGY.GetAdjective] конференция [getYear] года"
 egypt.2.d:0 "По инициативе [EGY.getAdjective] правительства была созвана Англо-[EGY.GetAdjective] конференция [getYear] года, на которой делегации двух стран встретятся в [907.GetCapitalVictoryPointName], чтобы обсудить положение и вклад [EGY.getNameDef] как части Содружества наций и [ENG.getAdjective] протектората.\n\nТемами конференции станут взаимная оборона на суше и в воздухе в случае иностранного вторжения, [EGY.GetAdjective]-[SUD.GetAdjective] отношения и сложный вопрос Суэцкого канала. Цель — заключить окончательный договор, который наверняка определит будущее отношений [EGY.GetNameDef] с [ENG.GetNameDef] и империей."
 egypt.2.a:0 "Хорошо."
 egypt.3.t:0 "Египет требует вывода британских войск"
 egypt.3.d:0 "В РАЗРАБОТКЕ"
 egypt.3.a:0 "Сопротивляться неизбежному почти бессмысленно."
 egypt.3.b:0 "Египет слишком важен, этого нельзя допустить."
 egypt.4.t:0 "[EGY.GetNameDefCap] угрожает нам сближением с [ITA.GetNameDef]"
 egypt.4.d:0 "[EGY.getNameDefCap] недавно ясно дало понять нашей делегации: если переговоры об [EGY.GetAdjective] независимости не продвинутся существенно, оно намерено установить дипломатические отношения с [ITA.getNameDef], рассчитывая получить больше от союзов с другими европейскими державами.\n\nЭто может быть блефом ради уступок, но риск столь резко потерять [EGY.GetAdjective] сторону из нашей сферы влияния может оказаться слишком велик."
 egypt.4.a:0 "К этой угрозе следует отнестись серьёзно."
 egypt.4.b:0 "Всего лишь блеф."
 egypt.5.t:0 "[ENG.getNameDefCap] соглашается на наши требования"
 egypt.5.d:0 "[ENG.GetAdjective] делегация приняла нашу угрозу во внимание и предложила дополнительные уступки в обмен на сохранение нашей ориентации на них.\n\nОни явно не желают допустить влияния соперничающих держав на нас вопреки воле [ENG.GetNameDef] и готовы принять дополнительные меры, чтобы этого избежать."
 egypt.5.a:0 "Они сделали правильный выбор."
 egypt.6.t:0 "[ENG.getNameDefCap] разоблачает наш блеф"
 egypt.6.d:0 "[ENG.GetAdjective] делегация фактически отвергла нашу угрозу как простой переговорный приём и не собирается на него поддаваться, полагая, что мы заинтересованы в сближении с [ITA.GetAdjective] стороной не больше, чем они сами.\n\nХотя на этот раз наш блеф разоблачили и поставили нас в неловкое положение, в будущем их бездействие, возможно, удастся использовать в своих интересах."
 egypt.6.a:0 "Могло пройти лучше."
 egypt.7.t:0 "Предложение об [EGY.getAdjective] независимости"
 egypt.7.d:0 "Во время конференции с [EGY.GetNameDef] [EGY.GetAdjective] делегация прямо спросила, как мы относимся к полной независимости без значительного [ENG.GetAdjective] влияния или поддержки.\n\nУ нас имеются важные интересы в [EGY.GetNameDef], поэтому необходимо занять твёрдую позицию по вопросу полного устранения нашего влияния и определить, насколько «независимыми» им позволено быть."
 egypt.7.a:0 "Мы не возражаем против полной [EGY.GetAdjective] независимости."
 egypt.7.b:0 "Египет слишком важен, чтобы отпустить его."
 egypt.8.t:0 "[ENG.getNameDefCap] не возражает против нашей независимости"
 egypt.8.d:0 "Делегация [ENG.GetNameDefCap] ответила на вопрос о полной независимости и заявила, что не будет возражать, если её интересы в нашей стране будут защищены и гарантированы, а Египет сохранит роль стратегического узла при необходимости.\n\nНесомненно, такая поддержка имеет цену, но это хороший шаг в правильном направлении."
 egypt.8.a:0 "Прекрасные новости."
 egypt.9.t:0 "[ENG.getNameDefCap] выступает против нашей независимости"
 egypt.9.d:0 "Делегация [ENG.GetNameDefCap] ответила на вопрос о полной независимости и твёрдо заявила, что намерена её предотвратить, поскольку считает угрозой своим интересам и стратегическим целям в регионе.\n\nПри столь высокомерном отношении к законной независимости нашей страны эффективно вести переговоры с [ENG.GetAdjective] стороной будет всё труднее."
 egypt.9.a:0 "Высокомерные глупцы."
 egypt.10.t:0 "[ENG.getNameDefCap] предоставляет нам промышленные уступки"
 egypt.10.d:0 "Средства из банка [ENG.GetNameDef] были направлены в наш национальный резерв якобы для поддержки развития страны и обеспечения прочного финансового будущего. Вероятно, это попытка сделать нас более благосклонными к [ENG.GetAdjective] стороне."
 egypt.10.a:0 "Приемлемые условия."
 egypt.11.t:0 "[ENG.getNameDefCap] предлагает договор о совместных военно-морских исследованиях"
 egypt.11.d:0 "[ENG.GetNameDefCap] предложило нашим флотам проводить совместные учения и временно сотрудничать в развитии военно-морских технологий. По их словам, взаимодействие морских сил укрепит интересы обеих сторон в Средиземном и Красном морях."
 egypt.11.a:0 "Это принесёт пользу обеим сторонам."
 egypt.12.t:0 "[EGY.getNameDefCap] просит расширить автономию"
 egypt.12.d:0 "В РАЗРАБОТКЕ"
 egypt.12.a:0 "Они лояльны и являются ценным союзником."
 egypt.12.b:0 "Они слишком ненадёжны."
 egypt.13.t:0 "[ENG.getNameDefCap] предоставляет нам большую автономию"
 egypt.13.d:0 "В РАЗРАБОТКЕ"
 egypt.13.a:0 "Египет и Британия едины навеки."
 egypt.14.t:0 "[ENG.getNameDefCap] отказывает нам в большей автономии"
 egypt.14.d:0 "В РАЗРАБОТКЕ"
 egypt.14.a:0 "Непредвиденное предательство."
 egypt.15.t:0 "Конференция завершилась в пользу [EGY.getNameDef]"
 egypt.15.d:0 "С окончанием конференции стало ясно, что [EGY.GetNameDef] Он одержал верх над [ENG.GetNameDef]. Теперь очевидно, что их право на самоопределение и изгнание [ENG.GetAdjective] Полное влияние в пользу [EGY.GetAdjective]Полная независимость страны теперь стала реальностью, и это процесс, который они могут принять в качестве курса действий, если захотят.\n\nНесмотря на это, [EGY.GetNameDef]Будущее остается неясным."
 egypt.15.a:0 "Конференция завершена."
 egypt.16.t:0 "Конференция завершилась в пользу [ENG.getNameDef]"
 egypt.16.d:0 "К завершению конференции стало ясно, что [ENG.GetNameDef] взяло верх над [EGY.GetNameDef]. [EGY.GetAdjective] сторона, похоже, обречена оставаться в подчинении у [ENG.GetAdjective] стороны, а независимость служит лишь формальностью для улучшения международного имиджа и успокоения населения. Интересы [ENG.GetAdjective] стороны в [EGY.GetNameDef] теперь закреплены железной хваткой.\n\nОднако это может усилить внутренние волнения из-за анти-[ENG.GetAdjective] настроений. Лишь время покажет будущее страны."
 egypt.16.a:0 "Конференция завершена."
 egypt.17.t:0 "Конференция завершилась безрезультатно"
 egypt.17.d:0 "Из-за непредвиденных обстоятельств конференция не смогла продолжиться либо ни одна сторона не получила явного преимущества. Неясно, как будут развиваться события, но обе стороны могут попытаться извлечь из этого выгоду."
 egypt.17.a:0 "Конференция завершена."
 egypt.18.t:0 "[EGY.getName] просит нашей поддержки"
 egypt.18.d:0 "[EGY.GetAdjective] движение «Братья-мусульмане», ныне действующее как подпольная партизанская организация, запросило материальную помощь или даже добровольцев на случай восстания против монархии и [ENG.GetAdjective] влияния. Оно стремится изгнать их из страны и создать сильное независимое арабское государство.\n\nЭто может стать возможностью создать дружественную страну на Ближнем Востоке и значительно ослабить влияние [ENG.GetNameDef] в регионе."
 egypt.18.a:0 "Мы поддержим друзей в борьбе против [ENG.GetNameDef]."
 egypt.18.a2:0 "Это возможность для нас."
 egypt.18.b:0 "Нас это не интересует."
 egypt.19.t:0 "[GER.getName] обещает поддержку"
 egypt.19.d:0 "[GER.GetNameDefCap] выразило твёрдую симпатию нашему делу и воспользовалось возможностью противостоять [ENG.GetAdjective] влиянию в Африке, предложив поддержку в случае восстания — материальную, людскую или обе сразу."
 egypt.19.a:0 "Отлично."
 egypt.19_tt:0 "С началом гражданской войны мы получим дополнительно §Y2000 единиц пехотного снаряжения§!."
 egypt.20.t:0 "[GER.getName] не предлагает поддержки"
 egypt.20.d:0 "Хотя [GER.GetNameDef] по-прежнему сочувствует нашей борьбе против роялизма и [ENG.GetNameDef], никакой поддержки нам предоставлено не будет. Возможно, это дипломатическая ошибка, но если мы сумеем проявить себя, между нашими странами ещё могут появиться новые возможности."
 egypt.20.a:0 "Прискорбно."
 egypt.21.t:0 "Вооружённые восстания в Судане"
 egypt.21.d:0 "В РАЗРАБОТКЕ"
 egypt.21.a:0 "Конфликт обостряется."
 egypt.22.t:0 "Восстание в Судане"
 egypt.22.d:0 "После нескольких месяцев непрерывного роста напряжённости в [SUD.GetNonIdeologyName] население всё сильнее недовольно нашей оккупацией. Жёсткая политика и общее отсутствие поддержки лишь усилили гнев и волнения среди [SUD.GetAdjective] народа.\n\nВ ответ группа [SUD.GetAdjective] националистических лидеров объединилась и начала вооружённое восстание против нашей оккупации. Оно быстро набирает силу: [SUD.GetAdjective] военнослужащие и мирные жители берутся за оружие ради своей свободы."
 egypt.22.a:0 "Восстание должно быть подавлено!"
 egypt.22.b:0 "Благородное дело."
 egypt.23.t:0 "[EGY.getName] предлагает выкупить Суэцкий канал"
 egypt.23.d:0 "В РАЗРАБОТКЕ"
 egypt.23.a:0 "Заманчивое предложение."
 egypt.23.b:0 "Мы никогда не продадим нечто настолько важное."
 egypt.24.t:0 "[907.Owner.getName] принимает наше предложение"
 egypt.24.d:0 "В РАЗРАБОТКЕ"
 egypt.24.a:0 "Правильный выбор."
 egypt.25.t:0 "[907.Owner.getName] отклоняет наше предложение"
 egypt.25.d:0 "В РАЗРАБОТКЕ"
 egypt.25.a:0 "Они отказываются вернуть то, что по праву принадлежит нам."
 egypt.26.t:0 "Фарук I восходит на престол"
 egypt.26.d:0 "После достижения Фаруком совершеннолетия его коронация состоялась в королевском дворце в [907.GetCapitalVictoryPointName]. Его сопровождали полиция [907.GetCapitalVictoryPointName] и королевская гвардия, а по прибытии встретили члены [EGY.GetAdjective] правительства и кабинета. Вскоре он был коронован королём [EGY.GetNameDef] и занял престол под именем Фарука I.\n\nФарук стал самым молодым коронованным монархом в истории страны. Сумеет ли он достичь того же престижа и оставить такое же наследие, как его покойный отец, ещё предстоит узнать."
 egypt.26.a:0 "Да здравствует Фарук I!"
 egypt.27.t:0 "Англо-[EGY.GetAdjective] конференция [getYear] года"
 egypt.27.d:0 "По инициативе [EGY.getAdjective] правительства была созвана Англо-[EGY.GetAdjective] конференция [getYear] года, на которой делегации двух стран встретятся в [907.GetCapitalVictoryPointName], чтобы обсудить положение и вклад [EGY.getNameDef] как части Содружества наций и [ENG.getAdjective] протектората.\n\nТемами конференции станут взаимная оборона на суше и в воздухе в случае иностранного вторжения, [EGY.GetAdjective]-[SUD.GetAdjective] отношения и сложный вопрос Суэцкого канала. Цель — заключить окончательный договор, который наверняка определит будущее отношений Египта с Британией и империей."
 egypt.27.a:0 "Хорошо."
 egypt.29.t:0 "[EGY.GetNameDefCap] вспоминает старые связи"
 egypt.29.d:0 "Правительство [EGY.GetName] предложило заключить личную унию между нашими странами, ссылаясь на общую историю, культурные связи и возможные экономические и военные выгоды.\n\n[EGY.GetAdjective] сторона утверждает, что такой союз принесёт обоим народам стабильность и процветание. Но следует ли нам в него вступать?"
 egypt.29.a:0 "Выгодное предложение."
 egypt.29.b:0 "Какая нелепость!"
 egypt.30.t:0 "[ALB.GetNameDefCap] соглашается на личную унию"
 egypt.30.d:0 "Правительство [ALB.GetNameDef] приняло наше предложение о личной унии. Мы рады объявить, что [ROOT.GetNonIdeologyName] и [ALB.GetNonIdeologyName] теперь объединены под властью одного правителя, что принесёт обеим странам больше стабильности и процветания. Это ещё один шаг к полному и законному объединению наших народов."
 egypt.30.a:0 "Хороший выбор."
 egypt.31.t:0 "[ALB.GetName] отклоняет наше предложение"
 egypt.31.d:0 "Правительство [ALB.GetNameDef] отказалось от предложения о личной унии. Ясно, что [ALB.GetAdjective] сторона продолжает обманывать себя и не желает признавать предначертанное судьбой единство наших народов."
 egypt.31.a:0 "В таком случае придётся отступить."
 egypt.31.b:0 "Мы попытались решить вопрос дипломатически."
 egypt.32.t:0 "Возвращение хедива"
 egypt.32.d:0 "Аббас II, последний хедив нашей страны до её упразднения в 1914 году по воле [ENG.GetNameDef], вернулся после обретения полной независимости от [ENG.GetAdjective] стороны и требует восстановить незаконно отнятый престол. По его словам, [EGY.GetLeader] является лишь очередной [ENG.GetAdjective] марионеткой, тогда как хедив был последним воплощением подлинной [EGY.GetAdjective] независимости.\n\nАббас II был тепло встречен народом и значительной частью правительства, которые считают его сильным лидером, необходимым [EGY.GetNameDef] после освобождения от [ENG.GetAdjective] власти. Фарук, разумеется, крайне недоволен."
 egypt.32.a:0 "Славная новая эпоха для [EGY.GetNameDef]!"
 egypt.33.t:0 "[EGY.GetName] предлагает пакт о ненападении"
 egypt.33.d:0 "Сегодня дипломат из [EGY.GetNameDef] предложил нашим странам заключить пакт о ненападении ради сохранения процветания и единства Ближнего Востока.\n\nСогласие может способствовать дальнейшему сотрудничеству между [TUR.GetAdjective] и [EGY.GetAdjective] народами, тогда как отказ способен лишь углубить раскол в регионе."
 egypt.33.a:0 "Во имя процветания Ближнего Востока."
 egypt.33.b:0 "Мы не родня, [EGY.GetLeader]."
 egypt.34.t:0 "[TUR.GetName] принимает наше предложение"
 egypt.34.d:0 "[TUR.GetNameDef] тепло приняло предложение о пакте ненападения, видя в нём важный шаг к сохранению ближневосточного процветания и единства. Это может положить начало долгой дружбе и дальнейшему сотрудничеству."
 egypt.34.a:0 "Мы ещё станем друзьями."
 egypt.35.t:0 "[TUR.GetName] отклоняет наше предложение"
 egypt.35.d:0 "[TUR.GetNameDef] отказалось от пакта о ненападении и оставило нашу дипломатическую инициативу без ответа. Похоже, [TUR.GetAdjective] сторона совершенно не заинтересована в сотрудничестве."
 egypt.35.a:0 "[TUR.GetLeader] далёк от реализма."
 egypt.36.t:0 "Мансурское соглашение"
 egypt.36.d:0 "Сегодня в Мансуре было заключено соглашение между партией «Вафд» и монархией. На фоне недавней политической нестабильности стороны договорились укрепить «Вафд» как правящую партию, а власть [EGY.GetLeader] ограничить рамками конституционного монарха с сохранением небольших политических полномочий.\n\nОжидается, что это предотвратит дальнейшую нестабильность, успокоит противников монархии и одновременно сохранит Фарука у власти."
 egypt.36.a:0 "Новый этап политической стабильности."
 egypt.37.t:0 "[SUD.GetNameDefCap] голосует за полную интеграцию"
 egypt.37.d:0 "Подсчёт голосов завершён, и [SUD.GetAdjective] население с небольшим перевесом поддержало полную интеграцию в [EGY.GetNameDef], считая единство с нами предпочтительнее отдельного государства. Похоже, проведённые реформы и развитие принесли плоды."
 egypt.37.a:0 "Теперь мы живём как равные."
 egypt.38.t:0 "[SUD.GetNameDefCap] голосует за ограниченную автономию"
 egypt.38.d:0 "Большинство [SUD.GetAdjective] населения проголосовало за ограниченную автономию в составе [EGY.GetNameDef], полагая, что им лучше оставаться внутри страны, но с собственными властями и законами. Возможно, реформы и развитие оказались недостаточны для полной интеграции, однако это всё равно шаг в верном направлении."
 egypt.38.a:0 "Прекрасный компромисс."
 egypt.39.t:0 "[SUD.GetNameDefCap] голосует за независимость"
 egypt.39.d:0 "Опросы проходят в и [SUD.GetAdjective] Голосовали за провозглашение независимости от [EGY.GetNameDef] и формируется [SUD.GetNameDef] как свою собственную нацию. Очевидно, что мы не сделали достаточно для того, чтобы убедить [SUD.GetAdjective] Чтобы принять интеграцию или автономию, мы можем принять это и отпустить их проницаемо или бросить вызов этому и потенциально поставить под угрозу все, над чем мы работали."
 egypt.39.a:0 "Прискорбный исход, но мы должны его принять."
 egypt.39.b:0 "Освобождение Судана близко!"
 egypt.39.c:0 "Выборы были сфальсифицированы, мы не можем это принять."
 egypt.40.t:0 "Политики ставят под сомнение курс [EGY.GetLeader]"
 egypt.40.d:0 "После восшествия [EGY.GetLeader] на престол политики и парламентарии почти сразу начали сомневаться в политическом курсе нового короля. Его отец Фуад I неоднократно пытался расширить собственную власть и ослабить парламент, но избегал крупного сопротивления благодаря образу национального лидера и харизме. Многие не уверены, последует ли [EGY.GetLeader] его примеру, и опасаются последствий из-за его общей некомпетентности и отстранённости."
 egypt.40.a:0 "Это просто слухи."
 egypt.41.t:0 "Парламент требует реформ"
 egypt.41.d:0 "В [EGY.GetAdjective] парламенте растёт оппозиция монархии и [EGY.GetLeader] из-за многолетней коррупции и злоупотреблений. Многие депутаты требуют масштабного реформирования институтов и полномочий короны, а наиболее смелые предлагают [EGY.GetLeader] вовсе отречься, называя [EGY.GetAdjective] монархию «символом прошлого», который следует заменить современной системой."
 egypt.41.a:0 "Политические основы не вечны."
 egypt.42.t:0 "Недовольство армии растёт"
 egypt.42.d:0 "[EGY.GetLeader] стал крайне непопулярен в [EGY.GetAdjective] армии, где его считают слабым и нерешительным монархом. Распространённая коррупция, прежде всего среди аристократии, подорвала финансирование и мораль вооружённых сил. Видные командиры Мухаммед Нагиб и Гамаль Абдель Насер открыто требуют свержения монархии и установления власти «сильного лидера»."
 egypt.42.a:0 "Вооружённые силы становятся всё более мятежными."
 egypt.43.t:0 "[EGY.GetNameDefCap] намерено захватить канал [911.GetName]"
 egypt.43.d:0 "Сегодня [EGY.GetAdjective] лидер [EGY.GetLeader] ясно заявил, что канал [911.GetName] по праву является частью страны и должен быть возвращён, даже силой.\n\nЭто может стать оправданием для захвата канала, поэтому следует готовиться к худшему."
 egypt.43.a:0 "Нужно что-то предпринять."
 egypt.44.t:0 "[EGY.GetAdjective] победа у [911.GetName]"
 egypt.44.d:0 "[EGY.GetAdjective] войска успешно вошли в зону канала [911.GetName], захватили Порт-Саид и теперь полностью контролируют канал и его работу.\n\nМы вернули Суэцкий канал, который удерживали от нас более 75 лет с момента его строительства, но теперь следует готовиться к ответу правительства [911.Owner.getAdjective]."
 egypt.44.a:0 "Мы лишь вернули своё."
 egypt.45.t:0 "[911.Owner.getAdjective] победа у [911.GetName]"
 egypt.45.d:0 "Силы обороны на [911.GetName] Каналу удалось успешно удержать [EGY.GetAdjective] Продвигаться вперед и отражать атаку, заставляя [EGY.GetAdjective]s отозвать. Канал прочно закрепился в [911.Owner.getAdjective] Контроль."
 egypt.45.a:0 "Крупный провал."
 egypt.45.b:0 "Это послужит им уроком."
 egypt.46.t:0 "[EGY.GetAdjective] победа у [911.GetName]"
 egypt.46.d:0 "[EGY.GetAdjective] войска успешно вошли в зону канала [911.GetName], захватили Порт-Саид и теперь полностью контролируют канал и его работу.\n\nЭто явная угроза нашим интересам в регионе. Как следует ответить?"
 egypt.46.a:0 "Глупо откладывать неизбежное."
 egypt.46.b:0 "Это неприемлемо, мы должны вернуть канал!"
 egypt.47.t:0 "Патовая ситуация у [911.GetName]"
 egypt.47.d:0 "Боевые действия в районе канала [911.GetName] зашли в тупик. Ни одна сторона не добилась успеха, и ситуация остаётся патовой. Неясно, как будет развиваться конфликт, но значительных изменений пока не произошло."
 egypt.47.a:0 "Что ж."
 egypt.48.t:0 "Переворот «Свободных офицеров»"
 egypt.48.d:0 "Рано утром националистически настроенные полицейские начали защищать и поддерживать сопротивление и нападения на королевские части в [GetCapitalVictoryPointName]. Вслед за этим ячейки движения «Свободные офицеры» организовали беспорядки и поджоги. Нарастающее недовольство в армии достигло предела, и вскоре батальоны пошли на штурм здания королевских офицеров и расположений командования.\n\nМухаммед Нагиб и Гамаль Абдель Насер совместно объявили Фарука низложенным и провозгласили Египетскую республику, первым президентом которой стал Насер. Вскоре Фарука вынудили отречься, после чего он отправился в изгнание.\n\nНасер обещает изгнать иностранное влияние из [ROOT.GetNonIdeologyName], вновь превратить страну в великую державу и сделать её объединяющей силой арабского мира."
 egypt.48.a:0 "Теперь мы покажем им, кто мы на самом деле."
 egypt.49.t:0 "Членство в анти-[ISR.GetAdjective] коалиции"
 egypt.49.d:0 "[EGY.GetNameDefCap] создало наступательную коалицию против сионистской политики [ISR.GetNameDef] и призвало все арабские страны взяться за оружие и уничтожить его. Военные операции уже начались. Следует ли нам присоединиться к борьбе и изгнать [ISR.GetNameDef] с Ближнего Востока?"
 egypt.49.a:0 "Мы поможем арабским братьям."
 egypt.49.b:0 "Нас это не интересует."
 egypt.50.t:0 "[EGY.GetNameDefCap] требует передать [SYR.GetNonIdeologyName] и [LEB.GetNonIdeologyName]"
 egypt.50.d:0 "[EGY.GetNameDefCap] предъявило ультиматум: немедленно предоставить независимость [SYR.GetNameDef] и [LEB.GetNameDef], вывести оттуда все наши силы и передать территории под исключительное [EGY.GetAdjective] управление — либо столкнуться с войной.\n\nЭто соответствует стремлению [EGY.GetLeader] расширить влияние в арабском мире и в итоге объединить его. Но стоит ли рисковать войной из-за этих территорий?"
 egypt.50.a:0 "Мы не в состоянии их защитить."
 egypt.50.b:0 "Глупо думать, что мы откажемся от столь важных земель."
 egypt.51.t:0 "[FROM.GetNameDefCap] выполняет наши требования"
 egypt.51.d:0 ""
 egypt.51.a:0 "Арабский мир становится сильнее."
 egypt.52.t:0 "Наши требования отклонены"
 egypt.52.d:0 "Империалистический угнетатель [FROM.GetNameDef], удерживающий [SYR.GetNameDef] и [LEB.GetNameDef], отказался передать территории, хотя мы законно стремимся изгнать империалистов из региона. Можно смириться с их властью либо пойти до конца и сражаться за единое арабское государство."
 egypt.52.d2:0 "Империалистический угнетатель [FROM.GetNameDef], удерживающий [LBA.GetNameDef], отказался передать территории, хотя мы законно стремимся изгнать империалистов из региона. Можно смириться с их властью либо пойти до конца и сражаться за единое арабское государство."
 egypt.52.d3:0 "Империалистический угнетатель [FROM.GetNameDef], удерживающий [ALG.GetNameDef], отказался передать территории, хотя мы законно стремимся изгнать империалистов из региона. Можно смириться с их властью либо пойти до конца и сражаться за единое арабское государство."
 egypt.52.a:0 "Они сделали свой выбор."
 egypt.52.b:0 "Не миром, так войной мы добьёмся единства!"
 egypt.53.t:0 "[EGY.GetNameDefCap] требует передать [LBA.GetNonIdeologyName]"
 egypt.53.d:0 "[EGY.GetNameDefCap] предъявило ультиматум: немедленно предоставить независимость [LBA.GetNameDef], вывести оттуда все наши силы и передать территорию под исключительное [EGY.GetAdjective] управление — либо столкнуться с войной.\n\nЭто соответствует стремлению [EGY.GetLeader] расширить влияние в арабском мире и в итоге объединить его. Но стоит ли рисковать войной из-за этих земель?"
 egypt.53.a:0 "Мы не в состоянии это защитить."
 egypt.53.b:0 "Глупо думать, что мы откажемся от столь важной территории."
 egypt.54.t:0 "[EGY.GetNameDefCap] требует передать [ALG.GetNonIdeologyName]"
 egypt.54.d:0 "[EGY.GetNameDefCap] предъявило ультиматум: немедленно предоставить независимость [ALG.GetNameDef], вывести оттуда все наши силы и передать территорию под исключительное [EGY.GetAdjective] управление — либо столкнуться с войной.\n\nЭто соответствует стремлению [EGY.GetLeader] расширить влияние в арабском мире и в итоге объединить его. Но стоит ли рисковать войной из-за этих земель?"
 egypt.54.a:0 "Мы не в состоянии это защитить."
 egypt.54.b:0 "Глупо думать, что мы откажемся от столь важной территории."
 egypt.55.t:0 "[EGY.GetNameDefCap] предлагает объединиться в единое арабское государство"
 egypt.55.d:0 "Сегодня [EGY.GetNameDefCap] направило официальное предложение объединиться в единое арабское государство под его руководством. По их словам, арабский мир слишком долго находился под гнётом империалистов и был расколот соперничеством, а теперь настало время объединиться и создать по праву могущественную арабскую державу, в формировании которой сможет участвовать [ROOT.GetAdjective] народ.\n\nПредложение звучит благородно и заманчиво, однако нельзя исключать, что это лишь способ расширить [EGY.GetAdjective] влияние и власть ради собственной выгоды."
 egypt.55.a:0 "Вместе мы сильнее."
 egypt.55.b:0 "Мы не станем ещё одним полицейским государством."
 egypt.56.t:0 "[EGY.GetNameDefCap] просит материальную помощь"
 egypt.56.d:0 "Дипломаты [EGY.GetNameDef] обратились к нам с просьбой об американской материальной помощи для развития и модернизации армии.\n\nХотя официальные отношения были установлены ещё в 1922 году после обретения независимости, это станет первым крупным дипломатическим соглашением между нашими странами. Это прекрасная возможность обрести дружественную страну на Ближнем Востоке и укрепить наши интересы в регионе."
 egypt.56.a:0 "Это прекрасная возможность улучшить отношения."
 egypt.56.b:0 "Нас не интересует [EGY.GetNameDef]."
 egypt.57.t:0 "[USA.GetNameDefCap] соглашается предоставить материальную помощь"
 egypt.57.d:0 "Наша делегация в [USA.GetNameDef] договорилась с их представителями о поставках пехотного снаряжения и артиллерии для развития и модернизации армии. Оборудование должно прибыть в ближайшее время."
 egypt.57.a:0 "Начало дружбы."
 egypt.58.t:0 "[USA.GetNameDefCap] отклоняет просьбу о материальной помощи"
 egypt.58.d:0 "Наша делегация в [USA.GetNameDef] не смогла договориться с дипломатами, и просьба о материальной помощи для развития и модернизации армии была отклонена. Мы ничего не получим."
 egypt.58.a:0 "Их потеря."
 egypt.59.t:0 "Политические фракции подрывают власть [EGY.GetLeader]"
 egypt.59.d:0 "[EGY.GetAdjective] народ и правительство всё сильнее сомневаются в способности [EGY.GetLeader] управлять страной после череды административных провалов. Всё больше политиков и армейских офицеров требуют ограничить его власть или вовсе свергнуть.\n\nПартия «Вафд», долгое время занимавшая ведущие позиции при монархии, выступает за превращение Фарука в конституционного монарха и собственное утверждение как главной партии [EGY.GetNameDef]. Тем временем видные военные, включая Гамаля Абдель Насера и Мухаммеда Нагиба, призывают к его свержению и созданию арабской республики, которая покончит с эпохой иностранного империализма.\n\nЕсли решение не будет найдено в ближайшее время, ситуация может выйти из-под контроля."
 egypt.59.a:0 "Положение Фарука рушится."
 egypt.60.t:0 "[EGY.GetNameDefCap] направляет дипломатическую миссию"
 egypt.60.d:0 "Сегодня [EGY.GetNameDef] направило к нам дипломатическую миссию из своих послов, надеясь расширить отношения, установить дружбу и заложить основу для будущего сотрудничества.\n\nЭто станет первым крупным дипломатическим контактом с [EGY.GetNameDef] после обретения им независимости в 1922 году и прекрасной возможностью получить дружественную страну на Ближнем Востоке и укрепить наши интересы в регионе."
 egypt.60.a:0 "Отправить [EGY.GetAdjective] стороне несколько танков в знак дружбы."
 egypt.60.b:0 "Они не представляют для нас значения."
 egypt.61.t:0 "[SOV.GetNameDefCap] положительно отвечает на дипломатическую миссию"
 egypt.61.d:0 "Наша дипломатическая миссия в [SOV.GetNameDef] была встречена с одобрением. Они, похоже, столь же заинтересованы в установлении дружественных отношений и дальнейшем сотрудничестве.\n\nКроме того, они предложили отправить нам сто своих лучших средних танков в качестве щедрого знака дружбы. Поставка ожидается в ближайшее время."
 egypt.61.a:0 "Щедрый подарок от новых друзей."
 egypt.62.t:0 "[SOV.GetNameDefCap] отклоняет дипломатическую миссию"
 egypt.62.d:0 "[SOV.GetNameDefCap], явно не заинтересованное в нашей делегации, отклонило дипломатическую миссию и не проявило желания устанавливать отношения или развивать сотрудничество.\n\nВозможно, единственная возможность наладить такие связи была упущена."
 egypt.62.a:0 "Это была глупая затея."
 egypt.63.t:0 "[EGY.GetNameDefCap] отправляет нам материальную помощь"
 egypt.63.d:0 "Сегодня [EGY.GetNameDefCap] объявило о намерении защищать нашу независимость и безоговорочно поддержать нас, чтобы «отвадить» любые внешние угрозы. Также нам будет направлено большое количество снаряжения в рамках «пакета модернизации» для развития армии.\n\nХотя это щедрый и желанный жест, возможно, он направлен скорее на защиту [EGY.GetAdjective] интересов, чем наших собственных."
 egypt.63.a:0 "Как щедро со стороны [EGY.GetAdjective] народа."
 egypt.64.t:0 "[EGY.GetNameDefCap] просит направить советников"
 egypt.64.d:0 "[EGY.GetNameDefCap] официально попросило временно направить офицеров нашей армии в качестве атташе для помощи в модернизации, подготовке и разработке тактики. Это может стать возможностью установить дружественные отношения с [EGY.GetNameDef] и включить его в нашу сферу влияния."
 egypt.64.a:0 "Это возможность для нас."
 egypt.64.b:0 "Нас не интересует [EGY.GetAdjective] сторона."
 egypt.65.t:0 "[GER.GetNameDefCap] соглашается направить советников"
 egypt.65.d:0 "[GER.GetNameDefCap] согласилось направить военную миссию для консультирования нашей армии и помощи в её модернизации и подготовке. [GER.GetAdjective] сторона назначила руководителем миссии пехотного офицера Вильгельма Фармбахера, который вскоре прибудет и поступит на службу."
 egypt.65.a:0 "Прекрасно."
 egypt.66.t:0 "[GER.GetNameDefCap] отказывается направлять советников"
 egypt.66.d:0 "[GER.GetNameDefCap] отказалось направить военную миссию для консультирования нашей армии и помощи в её модернизации и подготовке. В дальнейшем едва ли стоит ожидать сотрудничества с [GER.GetNameDef]."
 egypt.66.a:0 "Для [GER.GetAdjective] стороны мы лишь пешки."
