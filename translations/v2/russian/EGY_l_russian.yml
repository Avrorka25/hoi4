 EGY_abu_suweir_air_base:0 "Авиабаза Абу-Сувейр"
 EGY_abu_suweir_air_base_desc:0 "Для расширения военно-воздушных сил мы выделим средства на строительство новых авиабаз. Лучшего места, чем стратегически важный район Исмаилии, не найти."
 EGY_victor_taits_legacy:0 "Наследие Виктора Тейта"
 EGY_victor_taits_legacy_desc:0 ""
 EGY_royal_egyptian_airforce:0 "[EGY.GetAdjective] военно-воздушные силы"
 EGY_royal_egyptian_airforce_desc:0 "Исторически [ROOT.GetNonIdeologyName] располагал крайне малочисленной авиацией, подчинённой оперативному командованию армии и флота. Настало время выделить её в самостоятельный род войск, чтобы она могла превратиться в эффективную и многочисленную боевую силу."
 EGY_purchase_audax_fighters:0 "Закупить истребители «Одакс»"
 EGY_purchase_audax_fighters_desc:0 ""
 EGY_bomber_production:0 "Производство бомбардировщиков"
 EGY_bomber_production_desc:0 "Изолированное положение страны позволяет предположить, что она не станет целью вражеских бомбардировок, поэтому небольших истребительных сил достаточно для защиты неба [ROOT.getNameDef]. Основные вложения следует направить на создание бомбардировщиков, способных наносить удары по промышленности противника издалека."
 EGY_al_zafir_kahi_missles:0 "Ракеты «Аль-Зафир» и «Аль-Кахир»"
 EGY_al_zafir_kahi_missles_desc:0 "В одном из исследовательских учреждений появилась интересная альтернатива бомбардировочным налётам: управляемый боеприпас, запускаемый с платформы и направляемый к цели без экипажа на борту. Это позволит сохранить здоровье и жизни наших пилотов и авиационных экипажей."
 EGY_solve_the_canal_issue:0 "Решить вопрос канала"
 EGY_solve_the_canal_issue_desc:0 ""
 EGY_militarize_the_canal_zone:0 "Милитаризировать зону канала"
 EGY_militarize_the_canal_zone_desc:0 ""
 EGY_expand_the_navy:0 "Расширить флот"
 EGY_expand_the_navy_desc:0 "По сравнению с армией военно-морские силы на протяжении многих лет сохранялись в относительно хорошем состоянии. Однако они далеки от совершенства, и для поддержания конкурентоспособности флота всегда есть возможности для улучшения."
 EGY_hunt_class_destroyers:0 "Эсминцы типа «Хант»"
 EGY_hunt_class_destroyers_desc:0 ""
 EGY_replace_miniscule_vessels:0 "Заменить малые суда"
 EGY_replace_miniscule_vessels_desc:0 "Новшества в морской войне постоянно разрабатываются и представляются на военно-морских конференциях и совместных учениях. Мы можем многому научиться не только у союзников и врагов, но и на собственном опыте."
 EGY_expand_alexandria_shipping:0 "Расширить Александрийское судоходство"
 EGY_expand_alexandria_shipping_desc:0 ""
 EGY_develop_port_sudan:0 "Развивать Порт-Судан"
 EGY_develop_port_sudan_desc:0 ""
 EGY_the_suez_alternative:0 "Альтернатива Суэцкому каналу"
 EGY_the_suez_alternative_desc:0 ""
 EGY_big_farouq:0 "«Большой Фарук»"
 EGY_big_farouq_desc:0 "Великая война ясно показала, что сражения выигрывают крупные орудия. Возможности нашего флота позволяют вложиться в разработку новых тяжёлых кораблей."
 EGY_carrier_development:0 "Разработка авианосцев"
 EGY_carrier_development_desc:0 "Авианосцы, представляющие собой огромные плавучие аэродромы, являются истинным лицом и главным боевым средством будущей морской войны. Отдельная программа их разработки обойдётся дорого, но это единственный путь к современному флоту."
 EGY_naval_attrition:0 "Изнурение на море"
 EGY_naval_attrition_desc:0 "Суэцкий канал является одним из крупнейших морских торговых путей мира. Использование подводных лодок для нарушения вражеского судоходства в этом важнейшем районе имело бы разрушительные последствия. Едва ли какая-либо страна решится пойти на такой риск."
 EGY_radar_defence_technologies:0 "Радиолокационные оборонные технологии"
 EGY_radar_defence_technologies_desc:0 "Используя сложную систему радионавигации, мы можем повысить способность самолётов и кораблей обнаруживать и поражать вражеские части даже ночью."
 EGY_el_saka_forces:0 "Силы «Эль-Саака»"
 EGY_el_saka_forces_desc:0 "Чтобы распространить возможности армии за пределы моря, необходимо сформировать подразделение морской пехоты, способное проводить дерзкие десантные операции."
 EGY_amphibious_exercises:0 "Десантные учения"
 EGY_amphibious_exercises_desc:0 "Эффективный транспортный флот столь же важен, как и подготовленная морская пехота. Одно бесполезно без другого."
 EGY_navy_of_the_two_banks:0 "Флот двух берегов"
 EGY_navy_of_the_two_banks_desc:0 ""
 EGY_supremacy_over_the_mediterranean:0 "Господство в Средиземном море"
 EGY_supremacy_over_the_mediterranean_desc:0 "[EGY.GetAdjective] флот уже зарекомендовал себя как могущественная сила, но для достижения давно желаемого международного престижа необходимо расширить влияние и превратить Средиземное море в [EGY.GetAdjective] воды."
 EGY_a_humiliation:0 "Сокрушительное унижение"
 EGY_a_humiliation_desc:0 "Мы были унижены. Синай и восточный берег Суэцкого канала находятся под контролем Израиля. Теперь нам решать: сесть за стол переговоров или вернуть территории силой."
 EGY_three_nos:0 "Три «нет»"
 EGY_three_nos_desc:0 "Нет миру.\nНет переговорам.\nНет признанию."
 EGY_egyptian_non_alligment:0 "[EGY.GetAdjective] неприсоединение"
 EGY_egyptian_non_alligment_desc:0 "После официального завершения [ENG.GetAdjective] протектората в 1922 году [EGY.GetNameDef] придерживается строгого нейтралитета в конфликтах. Однако из-за уникального положения Египта сохранить этот курс может оказаться трудно."
