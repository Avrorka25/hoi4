 EGY_suppress_sudanese_separatists_in_upper_nile_region:0 "Подавить сепаратистов в регионе Верхнего Нила"
 EGY_suppress_sudanese_separatists_in_upper_nile_region_desc:0 "$EGY_standard_suppression_description$"
 EGY_high_compliance_reminder:0 "§YКогда подчинение станет достаточно высоким, станет доступно решение по превращению этого региона в национальную территорию.§!"
 EGY_exert_royal_influence_description:0 "В последние годы королевское влияние в [SUD.GetAdjective] регионах ослабевает. Мы проведём пропагандистские кампании, чтобы напомнить местным жителям, кому они обязаны хранить верность."
