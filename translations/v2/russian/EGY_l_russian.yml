 EGY_AI_BEHAVIOR:0 "@EGY Египет"
 EGY_RULE_OPTION_HISTORICAL:0 "Сохранить статус-кво"
 EGY_RULE_OPTION_HISTORICAL_AI_DESC:0 "Великобритания будет одобрена на англо-египетской конференции, и статус-кво статуса протектората Египта будет сохранен."
 EGY_RULE_OPTION_GOV_GENERAL:0 "Расширить полномочия генерал-губернатора"
 EGY_RULE_OPTION_GOV_GENERAL_AI_DESC:0 "Великобритания получит одобрение на англо-египетской конференции, а генерал-губернатор будет наделен полномочиями, что потенциально приведет к гражданской войне в стране."
 EGY_RULE_OPTION_NASSERIST:0 "Переворот «Свободных офицеров»"
 EGY_RULE_OPTION_NASSERIST_AI_DESC:0 " \"Египету будет отдана предпочтение на англо-египетской конференции, и после обретения независимости и смерти Фауда I король Фарук I будет свергнут свободными офицерами во главе с Гамалем Абдель Насером."
 EGY_RULE_OPTION_DEMOCRATIC:0 "Мансурское соглашение"
 EGY_RULE_OPTION_DEMOCRATIC_AI_DESC:0 "Египет получит одобрение на англо-египетской конференции, а после обретения независимости демократические и монархические фракции пойдут на компромисс и установят конституционную монархию."
 EGY_RULE_OPTION_KHEDIVE:0 "Восстановление хедивата"
 EGY_RULE_OPTION_KHEDIVE_AI_DESC:0 "Египет получит одобрение на англо-египетской конференции, а после обретения независимости попытается восстановить Османский хедиват."
 EGY_RULE_OPTION_MONARCHIST:0 "Правление Фарука"
 EGY_RULE_OPTION_MONARCHIST_AI_DESC:0 "Египет получит одобрение на англо-египетской конференции, а после обретения независимости укрепит полномочия короля Фарука I."
 EGY_RULE_OPTION_ISLAMIST:0 "Исламистский переворот"
 EGY_RULE_OPTION_ISLAMIST_AI_DESC:0 "Великобритания будет одобрена на англо-египетской конференции, но египетское правительство будет свергнуто «Братьями-мусульманами», которые установят в государстве исламистский режим."
