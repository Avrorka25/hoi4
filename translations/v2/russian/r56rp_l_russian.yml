 political_actions_desc:0 "§R- Внимание--§!\nЗдесь вы найдете решения, которые позволят вам противодействовать недружественным группам вашим идеям правительства. §YСпецифическая нация§! Решения с навязчивыми результатами и многое другое!"
 economy_decisions_desc:0 "§R- Внимание--§!\nЗдесь вы найдете решения, которые позволят вам улучшить вашу отрасль, модернизировать ее или сделать ее более эффективной. §YРешения по урбанизации§! Это позволит вам увеличить количество строительных слотов в выбранных регионах."
 propaganda_efforts_desc:0 "§R- Внимание--§!\nЗдесь вы найдете решения, которые позволят вам улучшить дух людей и многие другие способности. §YУсилия войны§! Распространять или распространять §YИдеологические идеи.§!"
 political_actions_desc:0 "§R- Внимание--§!\nЗдесь вы найдете решения, которые позволят вам противодействовать недружественным группам вашим идеям правительства. §YСпецифическая нация§! Решения с навязчивыми результатами и многое другое!"
 economy_decisions_desc:0 "§R- Внимание--§!\nЗдесь вы найдете решения, которые позволят вам улучшить вашу отрасль, модернизировать ее или сделать ее более эффективной. §YРешения по урбанизации§! Это позволит вам увеличить количество строительных слотов в выбранных регионах."
 propaganda_efforts_desc:0 "§R- Внимание--§!\nЗдесь вы найдете решения, которые позволят вам улучшить дух людей и многие другие способности. §YУсилия войны§! Распространять или распространять §YИдеологические идеи.§!"
 morevolunteers_mercenary:0 "Разрешить наемническую экспедиционную службу"
 morevolunteers_mercenary_desc:0 "Позиция наших стран в отношении заморских конфликтов проста: самый высокий претендент получит нашу поддержку в их вооруженном конфликте. Мы не сможем найти союзников из-за нашей сомнительной позиции по конфликтам за рубежом, пока мы не расформируем Ядро наемников."
 morevolunteers_minor_start:0 "Разрешить военную службу за рубежом"
 morevolunteers_minor_start_desc:0 "С ростом напряженности и мировой войной на горизонте мы должны позволить нашим военным отправлять добровольцев по всему миру, чтобы получить ценный опыт, который может помочь нам в наших собственных военных исследованиях."
 morevolunteers_minor:0 "Расширение военной службы за рубежом"
 morevolunteers_minor_desc:0 "Видя ценную информацию, которую нам предоставляют заморские конфликты, мы должны расширить зарубежную службу и, надеюсь, получить больше информации о современных методах ведения войны."
 morevolunteers_major_start:0 "Формирование экспедиционных сил"
 morevolunteers_major_start:0 "С ростом напряженности и на грани новой мировой войны жизненно важно, чтобы мы приобрели ценный опыт в современных конфликтах."
 morevolunteers_major:0 "Расширение экспедиционных сил"
 morevolunteers_major_desc:0 "Видя ценную информацию, которую нам предоставляют заморские конфликты, мы должны расширить зарубежную службу и, надеюсь, получить больше информации о современных методах ведения войны и связать нас с правительствами за рубежом."
 morevolunteers_disband_major:0 "Расформировать экспедиционные силы"
 morevolunteers_disband_major_desc:0 "Имея ценную информацию, полученную в результате конфликтов за рубежом, мы должны распустить наши постоянно растущие экспедиционные силы."
