 r56rp_officer_training_desc:0 "§R- Внимание--§!\nЗдесь вы найдете решения, которые позволят вам получить ценный армейский опыт и потратить его на... §YУлучшения§! Выберите свой народ, выберите свой §YМилитаристское участие§! в иностранных конфликтах и в преследовании §YОружейные сделки§! с другими нациями."
 send_officers_to_specialized_training:0 "Отправьте своих офицеров на обучение"
 send_officers_to_specialized_training_desc:0 "Большая часть наших офицеров практически не имеет опыта работы на своих должностях, мы должны расширить наши программы обучения, чтобы наши новые и старые офицеры могли научиться некоторым трюкам."
 send_officers_to_specialized_training_tt:0 "случайный §OГенерал§! У вас есть шанс выиграть §GСлучайные черты§W или высокий шанс получить случайный §Gнавыки§W"
