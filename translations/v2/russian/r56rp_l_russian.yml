 r56rp_great_power_conference:0 "Нажмите на большую конференцию"
 r56rp_great_power_conference_desc:0 "Это решение уведомит мир о Великой конференции, которая будет возобновлена через 180 дней."
 r56rp_great_power_event.1.t:0 "Великая конференция"
 r56rp_great_power_event.1.desc:0 "[FROM.GetLeader] Он призвал к встрече всех великих держав мира.\n\nThe §OМеждународная конференция§! Для размещения всех участников эта конференция будет длиться несколько недель, пока каждый вопрос, находящийся в руках, не будет обсужден, рассмотрен и оставлен без каких-либо сомнений.\n\nДипломаты из многих крупных стран, как уже сообщалось, уехали на конференцию в надежде обеспечить безопасность своих государств без препятствий со стороны других мировых держав."
 r56rp_great_power_events.1.a:0 "Почему меня это должно волновать?"
 great_conference_called_tt:0 "Большая конференция уже началась"
 great_conference_called:0 "Великая конференция в прогрессе"
 r56rp_capitulation_fight_on.1.t:0 "Тревожные сообщения с фронта"
 r56rp_capitulation_fight_on.1.desc:0 "Наши объединенные союзные силы рушятся, враг каждую неделю отодвигает их дальше, у нас есть выбор: сражаться или надеяться на условный мир с нашими общими врагами."
 r56rp_capitulation_fight_on.1.a:0 "Мы сражаемся! Неважно, сколько это будет стоить!"
 r56rp_capitulation_fight_on.1.b:0 "Мы должны спасти себя..."
 fight_on_tt1:0 "Мы станем одним из главных участников этого конфликта, что позволит нам продолжать борьбу, даже если наш союзник капитулирует."
 fight_on_tt2:0 "Мы покинем фракцию наших союзников, давая нам возможность предложить мир нашему врагу или если он откажется сражаться в одиночку."
 r56rp_irregular_forces:0 "Поднять нерегулярные леви"
 r56rp_SOV_defence_against_nordics:0 "Северная борьба"
 r56rp_SOV_defence_against_nordics_desc:0 "С войной на севере наша оборона была спешно подготовлена, однако наши храбрые солдаты удерживают линию против нордического наступления! Мы победим в этой борьбе!"
 r56rp_yugoslavian_menace.1.t:0 "[YUG.GetNameDefCap] Он оказывает влияние на крестьян!"
 r56rp_yugoslavian_menace.1.desc:0 "Югославы посылают в нашу страну вооруженные ополченцы в надежде дестабилизировать и сплотить крестьян для установления коммунистического режима! Если мы не хотим страдать от гражданского неповиновения этим угрозам, мы должны действовать быстро и запретить коммунистическим сторонникам удерживать власть в нашей стране!\n\n§R- Предупреждение--§!\nЕсли вы не хотите гражданской войны, мы настоятельно рекомендуем вам запретить коммунизм."
 r56rp_yugoslavian_menace.1.a:0 "Я понимаю."
