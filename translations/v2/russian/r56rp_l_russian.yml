 r56rp_civoil_reminder.1.t:0 "Гражданский сектор голодает из-за топлива"
 r56rp_civoil_reminder.1.d:0 "Наши запасы топлива ниже 5%, и наш гражданский сектор начинает замедляться. Нам нужно держать запасы топлива выше 10%, иначе мы рискуем полным крахом гражданского сектора."
 r56rp_civoil_reminder.1.a:0 "Понятно."
