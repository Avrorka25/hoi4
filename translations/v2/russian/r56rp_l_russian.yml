 r566rp_cannot_declare_on_disabled_continent:0 "Не может совершить это действие против нетрудоспособного континента."
 r56rp_coordinated_attack:0 "Запуск ракеты Z"
 r56rp_coordinated_attack_desc:0 "Для того, чтобы обеспечить наше нападение на филиппинцев и замедлить спящего гиганта, жизненно важно, чтобы мы убрали способность их тихоокеанского флота противостоять нашим!"
 r56rp_coordinated_attack.1.t:0 "Сюрприз японской атаки против американских войск!"
 r56rp_coordinated_attack.1.d:0 "Японские военно-морские силы начали атаку на наши корабли, дислоцированные на Гавайях, со многими сообщениями о жертвах и по меньшей мере 4 боевыми кораблями, затонувшими в результате атаки, стали сюрпризом для всех."
 r56rp_coordinated_attack.1.a:0 "О, варварство!"
 r56rp_coordinated_attack.2.t:0 "Американские военно-морские силы на Гавайях атакованы!"
 r56rp_coordinated_attack.2.d:0 "Японские военно-морские силы в первые часы сегодняшнего дня начали атаку против наших сил, дислоцированных на Гавайях, К счастью, достаточно наших храбрых моряков мчались к своим кораблям и из страха внезапной атаки, однако ранние сообщения заявили, что мы потеряли по крайней мере 2 линкора в бою."
 r56rp_coordinated_attack.2.a:0 "Японцы ответят за это нападение кровью."
 r56rp_coordinated_attack.3.t:0 "Уничтожение нашего первого воздушного флота!"
 r56rp_coordinated_attack.3.d:0 "Ранним утром наши войска атаковали военно-морскую базу на Гавайях. С небольшим успехом наш знаменитый Первый воздушный флот теперь лежит на дне океана."
 r56rp_coordinated_attack.3.a:0 "Теперь наша судьба опечатана."
 r56rp_United_Arab_Republic_Formation:0 "Формирование Объединенной Арабской Республики"
 r56rp_United_Arab_Republic_Formation_desc:0 "С образованием республики мы объявили о своих притязаниях на все арабские районы большинства в мире, многие из этих территорий под колониальными режимами, что для нас значительно облегчает интерграцию этим людям, желающим какого-то большинства правления."
