 chinajapanese.1.t:0 "Письмо из Нанкина"
 chinajapanese.1.desc:0 "В связи с ростом напряженности в Азии, [CHI.GetNameDefCap] Взгляд в сторону [GER.GetNameDefCap] Мы стремимся к большей дружбе с нами. Взамен они предложили нам права на ресурсы для своих богатых южных земель вольфрама и хрома, если мы решим принять их, мы можем получить ценного союзника на Востоке."
 chinajapense.1.a:0 "Конечно, мы любезно принимаем!"
 chinajapense.1.b:0 "Мы не нуждаемся в их ресурсах!"
 chinajapanese.2.t:0 "Дипломаты из Нанкина"
 chinajapanese.2.desc:0 "В связи с ростом напряженности в Азии, [CHI.GetNameDefCap] Взгляд в сторону [GER.GetNameDefCap] Мы стремимся к большей дружбе с нами. Попросив присоединиться к исследовательской группе, направленной на улучшение технологического роста обеих наших стран, если мы решим принять это, мы значительно улучшим наши отношения."
 chinajapense.2.a:0 "Исследовательская группа, говорите? Мы принимаем!"
 chinajapense.2.b:0 "Нет! Никогда, наш технологический прогресс не является нашим и только нашим!"
 angered_china_tt:0 "§RЭто сильно испортит наши отношения. [CHI.GetNameDefCap]§!"
 happy_china_tt:0 "§GЭто значительно улучшит наши отношения с [CHI.GetNameDefCap]§!"
 possible_rewardsger_tt:0 "§GВозможные выгоды от принятия:§!"
 POLITICS_RT56_TOMATO_DESC:0 "Долгожданное возвращение Бога-Императора, наконец, мезастазировало, и со своими Легионами Судьбы он создаст величайший Ролевой Мод Всего, с одним кольцом, управляющим всем, что он покорит мир. Его праведность известна всем, кто ступил на великую землю: Империя, которую он провозгласил, теперь будет служить свидетельством теней Штренга, разрушительные идеи демократии, коммунизма, фашизма не принесли никакой надежды народу Австрии, где как истинный лидер Томатозз первый приведет австрийский народ и объединенный народ земли к славе. Его имя будет известно во всех семьях, многие помнят его как великого лидера революции РП, лидера против культа Дискарда."
 ENG_reform_the_raj:0 "Восстановление Британского Раджа"
 ENG_reform_the_raj_desc:0 "Восстановление коронной жемчужины Империи дает нам возможность восстановить падшее колониальное правительство, позволяя нам сосредоточиться на других территориях и проблемах."
 ENG_reform_the_raj_tt:0 "Мы или наш индийский подданный должны контролировать все ранее удерживаемые земли британским раджем."
 JAP_train_for_the_northern_campaign:0 "Подготовка к Северной кампании"
 JAP_train_for_the_northern_campaign_desc:0 "Чтобы победить в борьбе с Северной угрозой, мы должны обучить наших солдат и оснастить их специальным оборудованием, чтобы подготовить их к суровому сибирскому климату."
 JAP_exploit_north_sakhalin_oil:0 "Эксплуатация нефтяных месторождений Северного Сахалина"
 JAP_exploit_north_sakhalin_oil_desc:0 "Чтобы обеспечить победу в нашей продолжающейся войне, мы должны раздвинуть границы добычи ресурсов!, Обильные нефтяные месторождения Северного Сахалина должны быть использованы в полном объеме для того, чтобы предоставить нашей армии и ВВС топливо, в котором она нуждается!"
 r56rp_hokushin_ron:0 "Хокусин-рон"
 r56rp_northern_doctrine_event.1.t:0 "Японское строительство на Восточном фронте"
 r56rp_northern_doctrine_event.1.desc:0 "Наши войска сообщили о наращивании японских войск на Маньчжурской границе, мудро посылать подкрепления на Дальний Восток, чтобы больше не было так называемых «пограничных столкновений»."
 r56rp_northern_doctrine_event.1.a:0 "Что делают эти надоедливые островитяне?"
